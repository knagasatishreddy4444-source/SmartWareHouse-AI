═══════════════════════════════════════════════════════════════════ */

const STATE = (() => {
  let _state = {
    // Data
    products: [],
    orders: [],
    exceptions: [],
    returns: [],
    activityFeed: [],
    workers: [],
    customers: [],
    zoneMetrics: {},

    // UI
    currentPage: 'dashboard',
    alerts: [],
    notifications: [],

    // Simulation
    simRunning: true,
    simTick: 0,
    orderIdCounter: 2300,

    // KPIs (recalculated)
    kpis: {
      ordersToday: 0,
      fulfillmentRate: 0,
      pendingPicks: 0,
      stockoutCount: 0,
      activeExceptions: 0,
      avgPickTime: 0,
      dispatchedToday: 0,
      revenueToday: 0,
    },
  };

  // Event listeners
  const _listeners = {};

  function on(event, fn) {
    if (!_listeners[event]) _listeners[event] = [];
    _listeners[event].push(fn);
  }

  function off(event, fn) {
    if (_listeners[event]) {
      _listeners[event] = _listeners[event].filter(f => f !== fn);
    }
  }

  function emit(event, data) {
    if (_listeners[event]) {
      _listeners[event].forEach(fn => fn(data));
    }
  }

  // ─── Initialize state from data ─────────────────────────────────
  function init() {
    DATA.init();
    _state.products  = DATA.products.map(p => ({ ...p }));
    _state.orders    = DATA.orders.map(o => ({ ...o }));
    _state.exceptions = DATA.exceptions.map(e => ({ ...e }));
    _state.returns   = DATA.returns.map(r => ({ ...r }));
    _state.activityFeed = DATA.activityFeed.map(a => ({ ...a }));
    _state.workers   = DATA.workers.map(w => ({ ...w }));
    _state.customers = DATA.customers.map(c => ({ ...c }));
    _state.zoneMetrics = { ...DATA.zoneMetrics };
    recalculateKPIs();
    generateAlerts();
  }

  // ─── KPI Calculation ─────────────────────────────────────────────
  function recalculateKPIs() {
    const now = new Date();
    const todayStart = new Date(now);
    todayStart.setHours(0, 0, 0, 0);

    const todayOrders = _state.orders.filter(o => new Date(o.createdAt) >= todayStart);
    const dispatched = _state.orders.filter(o => o.status === 'dispatched' && new Date(o.dispatchedAt || o.createdAt) >= todayStart);
    const picking = _state.orders.filter(o => o.status === 'picking');
    const exceptions = _state.exceptions.filter(e => e.status !== 'resolved');

    _state.kpis = {
      ordersToday: todayOrders.length,
      fulfillmentRate: dispatched.length > 0 && todayOrders.length > 0
        ? Math.round((dispatched.length / todayOrders.length) * 100) : 0,
      pendingPicks: picking.length + _state.orders.filter(o => o.status === 'allocated').length,
      stockoutCount: _state.products.filter(p => p.currentStock === 0).length,
      activeExceptions: exceptions.length,
      avgPickTime: 4.3,
      dispatchedToday: dispatched.length,
      revenueToday: dispatched.reduce((s, o) => s + o.totalValue, 0),
      pendingOrders: _state.orders.filter(o => !['dispatched'].includes(o.status)).length,
      lowStockCount: _state.products.filter(p => p.stockStatus === 'low' || p.stockStatus === 'critical').length,
      slaBreachRisk: _state.orders.filter(o =>
        !['dispatched'].includes(o.status) && o.hoursToSla < 2 && o.hoursToSla >= 0
      ).length,
    };

    emit('kpis-updated', _state.kpis);
  }

  // ─── Alert Generation ────────────────────────────────────────────
  function generateAlerts() {
    const alerts = [];

    // Out-of-stock alerts
    _state.products.filter(p => p.currentStock === 0).forEach(p => {
      alerts.push({
        id: `alert-oos-${p.id}`,
        severity: 'critical',
        title: `Out of Stock: ${p.name}`,
        desc: `SKU ${p.id} is completely out of stock. Last restocked ${formatTimeAgo(p.lastRestocked)}.`,
        action: 'Reorder Now',
        time: new Date().toISOString(),
        skuId: p.id,
        type: 'stockout',
      });
    });

    // Critical stock alerts
    _state.products.filter(p => p.stockStatus === 'critical' && p.currentStock > 0).forEach(p => {
      alerts.push({
        id: `alert-crit-${p.id}`,
        severity: 'warning',
        title: `Critical Stock: ${p.name}`,
        desc: `Only ${p.currentStock} units left (safety stock: ${p.safetyStock}). Reorder point: ${p.reorderPoint}.`,
        action: 'Schedule Reorder',
        time: new Date().toISOString(),
        skuId: p.id,
        type: 'low-stock',
      });
    });

    // SLA breach risks
    _state.orders.filter(o => !['dispatched'].includes(o.status) && o.hoursToSla < 2 && o.hoursToSla > 0).forEach(o => {
      alerts.push({
        id: `alert-sla-${o.id}`,
        severity: 'critical',
        title: `SLA Breach Risk: ${o.id}`,
        desc: `${o.type} order for ${o.customer.name} breaches SLA in ${(o.hoursToSla * 60).toFixed(0)} min. Currently: ${o.status}.`,
        action: 'Rush Process',
        time: new Date().toISOString(),
        orderId: o.id,
        type: 'sla',
      });
    });

    // Overdue SLA
    _state.orders.filter(o => !['dispatched'].includes(o.status) && o.hoursToSla < 0).forEach(o => {
      alerts.push({
        id: `alert-breach-${o.id}`,
        severity: 'critical',
        title: `SLA BREACHED: ${o.id}`,
        desc: `${o.type} order breached SLA ${Math.abs(o.hoursToSla * 60).toFixed(0)} min ago. Immediate action required.`,
        action: 'Escalate',
        time: new Date().toISOString(),
        orderId: o.id,
        type: 'sla-breach',
      });
    });

    _state.alerts = alerts.slice(0, 10);
    emit('alerts-updated', _state.alerts);
  }

  // ─── Order Actions ───────────────────────────────────────────────
  function advanceOrderStatus(orderId) {
    const order = _state.orders.find(o => o.id === orderId);
    if (!order) return null;

    const lifecycle = ['created', 'allocated', 'picking', 'packing', 'qc', 'dispatched'];
    const currentIdx = lifecycle.indexOf(order.status);
    if (currentIdx < lifecycle.length - 1) {
      const oldStatus = order.status;
      order.status = lifecycle[currentIdx + 1];
      if (order.status === 'dispatched') {
        order.dispatchedAt = new Date().toISOString();
        order.trackingId = 'TRK' + Math.random().toString(36).substr(2, 9).toUpperCase();
        // Update stock
        order.items.forEach(item => {
          const prod = _state.products.find(p => p.id === item.skuId);
          if (prod) {
            prod.currentStock = Math.max(0, prod.currentStock - item.qty);
            prod.stockStatus = DATA.getStockStatus(prod.currentStock, prod.reorderPoint, prod.safetyStock);
            prod.stockPct = Math.min(100, (prod.currentStock / prod.maxCapacity) * 100);
          }
        });
      }
      if (order.status === 'picking') {
        order.pickerAssigned = _state.workers[Math.floor(Math.random() * 4)].id;
      }

      addActivity({
        type: order.status,
        color: { allocated: '#06b6d4', picking: '#f59e0b', packing: '#8b5cf6', qc: '#3b82f6', dispatched: '#10b981' }[order.status] || '#94a3b8',
        text: `Order ${orderId} moved to ${order.status.toUpperCase()}${order.status === 'dispatched' ? ` — Tracking: ${order.trackingId}` : ''}`,
      });

      recalculateKPIs();
      generateAlerts();
      emit('order-updated', order);
      return order;
    }
    return order;
  }

  function createOrder(orderData) {
    const now = new Date();
    const slaDurationH = { VIP: 4, Express: 8, Standard: 24, Bulk: 72 }[orderData.type];
    const slaDeadline = new Date(now.getTime() + slaDurationH * 3600000);
    const hoursToSla = slaDurationH;
    const totalValue = orderData.items.reduce((s, i) => s + i.qty * i.unitPrice, 0);

    const newOrder = {
      id: `ORD-${++_state.orderIdCounter}`,
      type: orderData.type,
      customer: orderData.customer || DATA.customers[Math.floor(Math.random() * DATA.customers.length)],
      createdAt: now.toISOString(),
      slaDeadline: slaDeadline.toISOString(),
      hoursToSla,
      status: 'created',
      items: orderData.items,
      totalValue,
      carrier: DATA.carriers[Math.floor(Math.random() * DATA.carriers.length)],
      priorityScore: DATA.calculatePriorityScore({ type: orderData.type, hoursToSla, totalValue, customerTier: orderData.customer?.tier || 'Standard' }),
      trackingId: null,
      pickerAssigned: null,
      notes: orderData.notes || '',
      exceptionId: null,
      isConflict: false,
      dispatchedAt: null,
    };

    // Check for stock conflicts
    newOrder.items.forEach(item => {
      const prod = _state.products.find(p => p.id === item.skuId);
      if (prod && prod.currentStock < item.qty) {
        newOrder.isConflict = true;
      }
    });

    _state.orders.unshift(newOrder);
    addActivity({ type: 'order', color: '#3b82f6', text: `New ${newOrder.type} order ${newOrder.id} created — ₹${newOrder.totalValue.toLocaleString('en-IN')} from ${newOrder.customer.name}` });
    recalculateKPIs();
    emit('order-created', newOrder);
    return newOrder;
  }

  function cancelOrder(orderId, reason) {
    const order = _state.orders.find(o => o.id === orderId);
    if (order && order.status !== 'dispatched') {
      order.status = 'exception';
      order.notes = reason || 'Cancelled';
      addActivity({ type: 'exception', color: '#f43f5e', text: `Order ${orderId} cancelled: ${reason || 'Manual cancellation'}` });
      recalculateKPIs();
      emit('order-updated', order);
    }
  }

  // ─── Exception Actions ───────────────────────────────────────────
  function resolveException(exceptionId, resolution) {
    const exc = _state.exceptions.find(e => e.id === exceptionId);
    if (exc) {
      exc.status = 'resolved';
      exc.resolvedAt = new Date().toISOString();
      exc.resolution = resolution;
      addActivity({ type: 'exception', color: '#10b981', text: `Exception ${exceptionId} resolved: ${resolution}` });
      recalculateKPIs();
      emit('exception-updated', exc);
    }
  }

  function createException(data) {
    const exc = {
      id: `EXC-${String(_state.exceptions.length + 7).padStart(3, '0')}`,
      ...data,
      status: 'open',
      createdAt: new Date().toISOString(),
      resolvedAt: null,
      suggestedAction: data.suggestedAction || 'Investigate and report to supervisor.',
    };
    _state.exceptions.unshift(exc);
    addActivity({ type: 'exception', color: '#f43f5e', text: `New exception ${exc.id} flagged: ${exc.description.substring(0, 60)}...` });
    emit('exception-created', exc);
    return exc;
  }

  // ─── Stock Actions ───────────────────────────────────────────────
  function adjustStock(skuId, delta, reason) {
    const prod = _state.products.find(p => p.id === skuId);
    if (prod) {
      prod.currentStock = Math.max(0, prod.currentStock + delta);
      prod.stockStatus = DATA.getStockStatus(prod.currentStock, prod.reorderPoint, prod.safetyStock);
      prod.stockPct = Math.min(100, (prod.currentStock / prod.maxCapacity) * 100);
      if (delta > 0) prod.lastRestocked = new Date().toISOString();
      addActivity({
        type: 'stock',
        color: delta > 0 ? '#10b981' : '#f59e0b',
        text: `Stock ${delta > 0 ? 'added' : 'adjusted'}: ${prod.name} — ${delta > 0 ? '+' : ''}${delta} units. ${reason || ''}`,
      });
      recalculateKPIs();
      generateAlerts();
      emit('stock-updated', prod);
    }
  }

  // ─── Activity ────────────────────────────────────────────────────
  function addActivity(item) {
    _state.activityFeed.unshift({
      id: `act-${Date.now()}`,
      ...item,
      time: new Date().toISOString(),
    });
    if (_state.activityFeed.length > 50) _state.activityFeed.pop();
    emit('activity-added', _state.activityFeed[0]);
  }

  // ─── Live Simulation Tick ────────────────────────────────────────
  function simulationTick() {
    if (!_state.simRunning) return;
    _state.simTick++;

    // Every 20 ticks (~20s): advance a random order
    if (_state.simTick % 20 === 0) {
      const eligible = _state.orders.filter(o => !['dispatched', 'exception'].includes(o.status));
      if (eligible.length > 0) {
        const order = eligible[Math.floor(Math.random() * Math.min(10, eligible.length))];
        advanceOrderStatus(order.id);
      }
    }

    // Every 30 ticks (~30s): new order arrives
    if (_state.simTick % 30 === 0) {
      const newOrder = DATA.generateNewOrder();
      _state.orders.unshift(newOrder);
      recalculateKPIs();
      emit('order-created', newOrder);
      addActivity({ type: 'order', color: '#3b82f6', text: `[AUTO] New ${newOrder.type} order ${newOrder.id} — ₹${newOrder.totalValue.toLocaleString('en-IN')} from ${newOrder.customer.name}` });
    }

    // Every 60 ticks (~60s): recalc SLA hours
    if (_state.simTick % 60 === 0) {
      const now = new Date();
      _state.orders.forEach(o => {
        o.hoursToSla = (new Date(o.slaDeadline) - now) / 3600000;
      });
      recalculateKPIs();
      generateAlerts();
    }

    // Every 45 ticks: minor stock fluctuation
    if (_state.simTick % 45 === 0) {
      const prod = _state.products[Math.floor(Math.random() * _state.products.length)];
      if (prod && prod.currentStock > 5) {
        prod.currentStock -= Math.floor(Math.random() * 3);
        prod.stockStatus = DATA.getStockStatus(prod.currentStock, prod.reorderPoint, prod.safetyStock);
        prod.stockPct = Math.min(100, (prod.currentStock / prod.maxCapacity) * 100);
        emit('stock-updated', prod);
      }
    }

    emit('sim-tick', _state.simTick);
  }

  // ─── Getters ─────────────────────────────────────────────────────
  function getState() { return _state; }
  function getProduct(id) { return _state.products.find(p => p.id === id); }
  function getOrder(id) { return _state.orders.find(o => o.id === id); }
  function getException(id) { return _state.exceptions.find(e => e.id === id); }

  // ─── Helpers ─────────────────────────────────────────────────────
  function formatTimeAgo(iso) {
    const d = new Date(iso);
    const diff = (Date.now() - d) / 1000;
    if (diff < 60) return `${Math.floor(diff)}s ago`;
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  return {
    init,
    on,
    off,
    emit,
    getState,
    getProduct,
    getOrder,
    getException,
    advanceOrderStatus,
    createOrder,
    cancelOrder,
    resolveException,
    createException,
    adjustStock,
    addActivity,
    simulationTick,
    recalculateKPIs,
    formatTimeAgo,
  };
})();

/* ═══ decisions.js ══════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════
   DECISIONS.JS — Smart Decision Engine
   AI-like conflict resolution & recommendation system
═══════════════════════════════════════════════════════════════════ */

const DECISIONS = (() => {

  // ─── Main conflict resolution engine ────────────────────────────
  function resolveConflict(order, conflictItems) {
    const decisions = [];

    conflictItems.forEach(({ item, product, available }) => {
      const decision = analyzeConflict(order, item, product, available);
      decisions.push(decision);
    });

    return {
      orderId: order.id,
      orderType: order.type,
      customer: order.customer,
      decisions,
      overallRecommendation: synthesizeRecommendations(order, decisions),
      confidence: calculateConfidence(order, decisions),
      timestamp: new Date().toISOString(),
    };
  }

  function analyzeConflict(order, item, product, available) {
    const needed = item.qty;
    const shortage = needed - available;
    const hoursToSla = order.hoursToSla;

    // Score options
    const options = [];

    // Option 1: Partial fulfill
    if (available > 0) {
      const partialScore = scorePartialFulfill(order, available, needed, hoursToSla);
      options.push({
        action: 'partial-fulfill',
        label: 'Partial Fulfillment',
        description: `Ship ${available} of ${needed} units now. Back-order ${shortage} units (ETA: ${product.leadTimeDays + 1} days).`,
        impact: `${available} units shipped immediately. Customer receives partial order.`,
        score: partialScore,
        icon: '📦',
        color: 'amber',
      });
    }

    // Option 2: Back-order all
    const backorderScore = scoreBackorder(order, hoursToSla, product.leadTimeDays);
    options.push({
      action: 'backorder',
      label: 'Full Back-Order',
      description: `Hold entire order. Source ${needed} units from ${product.supplier}. ETA: ${product.leadTimeDays + 1} days.`,
      impact: `Order delayed by ~${product.leadTimeDays + 1} days. SLA breach ${hoursToSla < (product.leadTimeDays + 1) * 24 ? 'LIKELY' : 'unlikely'}.`,
      score: backorderScore,
      icon: '🔄',
      color: hoursToSla < (product.leadTimeDays + 1) * 24 ? 'rose' : 'blue',
    });

    // Option 3: Source from alternate zone/location
    const altScore = scoreAlternateSource(order, product);
    options.push({
      action: 'alternate-source',
      label: 'Alternate Sourcing',
      description: `Request emergency stock from nearest distribution center or inter-warehouse transfer.`,
      impact: `Adds 6–12h delay. Additional logistics cost ₹${(needed * 50).toLocaleString('en-IN')}.`,
      score: altScore,
      icon: '🚛',
      color: 'violet',
    });

    // Option 4: Cancel item
    if (order.items.length > 1) {
      options.push({
        action: 'cancel-item',
        label: 'Cancel This Item',
        description: `Remove ${item.skuName} from order. Fulfill remaining items immediately.`,
        impact: `Order value reduced by ₹${(needed * item.unitPrice).toLocaleString('en-IN')}. Other items unaffected.`,
        score: order.type === 'VIP' ? 5 : 15,
        icon: '❌',
        color: 'rose',
      });
    }

    // Sort by score descending
    options.sort((a, b) => b.score - a.score);

    return {
      skuId: item.skuId,
      skuName: item.skuName,
      requested: needed,
      available,
      shortage,
      leadTimeDays: product.leadTimeDays,
      supplier: product.supplier,
      options,
      recommended: options[0],
      reasoning: generateReasoning(order, item, product, available, options[0]),
    };
  }

  // ─── Scoring functions ───────────────────────────────────────────
  function scorePartialFulfill(order, available, needed, hoursToSla) {
    let score = 40;
    const pct = available / needed;
    // More available = better
    score += pct * 20;
    // VIP/Express prefer any fulfillment over none
    if (order.type === 'VIP') score += 15;
    if (order.type === 'Express') score += 10;
    // SLA urgency boosts partial
    if (hoursToSla < 4) score += 15;
    else if (hoursToSla < 8) score += 8;
    // High value orders prefer partial
    if (order.totalValue > 50000) score += 10;
    return Math.min(100, score);
  }

  function scoreBackorder(order, hoursToSla, leadTimeDays) {
    let score = 30;
    // Long SLA remaining is fine for backorder
    if (hoursToSla > leadTimeDays * 24 + 12) score += 25;
    else if (hoursToSla > leadTimeDays * 24) score += 10;
    else score -= 20; // SLA will breach
    // Bulk orders can wait
    if (order.type === 'Bulk') score += 20;
    if (order.type === 'Standard') score += 10;
    // VIP can't wait
    if (order.type === 'VIP') score -= 30;
    if (order.type === 'Express') score -= 15;
    return Math.max(0, Math.min(100, score));
  }

  function scoreAlternateSource(order, product) {
    let score = 45;
    // High value justifies extra logistics cost
    if (order.totalValue > 30000) score += 15;
    if (order.type === 'VIP') score += 20;
    if (order.type === 'Express') score += 10;
    // Not worth it for cheap items
    if (product.unitPrice < 500) score -= 25;
    return Math.max(0, Math.min(100, score));
  }

  function synthesizeRecommendations(order, decisions) {
    const allRecommended = decisions.map(d => d.recommended.action);

    // Simple majority
    const counts = {};
    allRecommended.forEach(a => { counts[a] = (counts[a] || 0) + 1; });
    const topAction = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];

    const summaries = {
      'partial-fulfill': `Partially fulfill ${order.id} with available stock and back-order shortfall. Prioritized because SLA window is tight and customer tier (${order.customer.tier}) requires immediate acknowledgement.`,
      'backorder': `Place entire order on back-order. Sufficient SLA buffer available to wait for full stock. Prevents partial delivery dissatisfaction.`,
      'alternate-source': `Source stock via emergency transfer. High order value and customer tier (${order.customer.tier}) justify additional logistics cost.`,
      'cancel-item': `Cancel conflicted items and fulfill remaining. Best option when conflicted SKU represents minor value and SLA pressure is high.`,
    };

    return summaries[topAction] || 'Evaluate each item individually based on priority and SLA.';
  }

  function calculateConfidence(order, decisions) {
    const scores = decisions.map(d => d.recommended.score);
    const avg = scores.reduce((s, v) => s + v, 0) / scores.length;
    // High score = high confidence
    if (avg > 75) return 'High';
    if (avg > 50) return 'Medium';
    return 'Low';
  }

  function generateReasoning(order, item, product, available, recommended) {
    const reasons = [];

    reasons.push(`Order type is ${order.type} — ${
      order.type === 'VIP' ? 'highest priority, zero tolerance for full back-order' :
      order.type === 'Express' ? 'high priority, prefers immediate partial fulfillment' :
      order.type === 'Standard' ? 'can tolerate short delays if SLA buffer exists' :
      'bulk order, can be split or delayed without SLA impact'
    }.`);

    if (order.hoursToSla < 4) {
      reasons.push(`SLA expires in ${(order.hoursToSla * 60).toFixed(0)} minutes — immediate action required.`);
    } else if (order.hoursToSla < 24) {
      reasons.push(`SLA expires in ${order.hoursToSla.toFixed(1)} hours — moderate urgency.`);
    } else {
      reasons.push(`SLA has ${order.hoursToSla.toFixed(0)}h remaining — low urgency, flexible options available.`);
    }

    if (available > 0) {
      reasons.push(`${available} of ${item.qty} units available (${Math.round(available / item.qty * 100)}% of demand). Partial fulfillment viable.`);
    } else {
      reasons.push(`Zero stock available for ${item.skuName}. Full sourcing required.`);
    }

    reasons.push(`Supplier lead time: ${product.leadTimeDays} days from ${product.supplier}.`);

    reasons.push(`Customer tier: ${order.customer.tier} — ${
      order.customer.tier === 'VIP' ? 'SLA breach has high business impact.' :
      order.customer.tier === 'Premium' ? 'Maintaining fulfillment quality is important.' :
      'Standard service level acceptable.'
    }`);

    return reasons;
  }

  // ─── Auto-allocation for an order ───────────────────────────────
  function checkOrderConflicts(orderId) {
    const state = STATE.getState();
    const order = state.orders.find(o => o.id === orderId);
    if (!order) return null;

    const conflicts = [];
    order.items.forEach(item => {
      const prod = state.products.find(p => p.id === item.skuId);
      if (prod && prod.currentStock < item.qty) {
        conflicts.push({ item, product: prod, available: prod.currentStock });
      }
    });

    if (conflicts.length === 0) return null;
    return resolveConflict(order, conflicts);
  }

  // ─── Priority queue sorter ───────────────────────────────────────
  function sortOrdersByPriority(orders) {
    return [...orders].sort((a, b) => {
      // First by priority score
      if (b.priorityScore !== a.priorityScore) return b.priorityScore - a.priorityScore;
      // Then by SLA deadline
      return new Date(a.slaDeadline) - new Date(b.slaDeadline);
    });
  }

  // ─── Reorder recommendations ─────────────────────────────────────
  function getReorderRecommendations(products) {
    return products
      .filter(p => p.currentStock <= p.reorderPoint)
      .map(p => {
        const urgency = p.currentStock === 0 ? 'Critical' :
                        p.currentStock <= p.safetyStock ? 'High' : 'Medium';
        const reorderQty = p.maxCapacity - p.currentStock;
        const estimatedCost = reorderQty * p.unitPrice * 0.6; // assume 60% of retail is cost
        return {
          product: p,
          urgency,
          reorderQty,
          estimatedCost,
          reason: p.currentStock === 0 ? 'Out of stock — immediate reorder critical' :
                  p.currentStock <= p.safetyStock ? `Below safety stock (${p.safetyStock} units)` :
                  `Below reorder point (${p.reorderPoint} units)`,
          suggestedSupplier: p.supplier,
          leadTimeDays: p.leadTimeDays,
        };
      })
      .sort((a, b) => {
        const u = { Critical: 3, High: 2, Medium: 1 };
        return u[b.urgency] - u[a.urgency];
      });
  }

  // ─── Pick path optimizer ─────────────────────────────────────────
  function optimizePickPath(items) {
    // Sort by zone then bin for optimal walk path
    const zoneOrder = { A: 1, B: 2, C: 3, D: 4, E: 5, F: 6 };
    return [...items].sort((a, b) => {
      const zA = zoneOrder[a.zone] || 99;
      const zB = zoneOrder[b.zone] || 99;
      if (zA !== zB) return zA - zB;
      return a.bin?.localeCompare(b.bin || '') || 0;
    });
  }

  // ─── Bottleneck detection ────────────────────────────────────────
  function detectBottlenecks(orders) {
    const stageCounts = {};
    const stages = ['created', 'allocated', 'picking', 'packing', 'qc', 'dispatched'];
    stages.forEach(s => { stageCounts[s] = 0; });

    orders.filter(o => o.status !== 'exception').forEach(o => {
      stageCounts[o.status] = (stageCounts[o.status] || 0) + 1;
    });

    // Find stage with most items (excluding dispatched)
    const pending = Object.entries(stageCounts)
      .filter(([s]) => s !== 'dispatched')
      .sort((a, b) => b[1] - a[1]);

    const bottleneck = pending[0];
    const suggestions = {
      picking: 'Assign more pickers or generate optimized pick paths to clear backlog.',
      packing: 'Open additional pack stations. Consider priority packing for VIP orders.',
      qc: 'Increase QC inspector throughput. Consider risk-based sampling for low-risk orders.',
      allocated: 'Check for stock conflicts blocking allocation. Run conflict resolution.',
      created: 'New orders queued for allocation. Run bulk allocation cycle.',
    };

    return {
      stageCounts,
      bottleneck: bottleneck ? { stage: bottleneck[0], count: bottleneck[1] } : null,
      suggestion: bottleneck ? suggestions[bottleneck[0]] : 'All stages flowing normally.',
    };
  }

  return {
    resolveConflict,
    checkOrderConflicts,
    sortOrdersByPriority,
    getReorderRecommendations,
    optimizePickPath,
    detectBottlenecks,
  };
})();

/* ═══ analytics.js ══════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════
   ANALYTICS.JS — Analytics Engine & Chart Renderer
   Pure Canvas charts, no dependencies
═══════════════════════════════════════════════════════════════════ */

const ANALYTICS = (() => {

  // ─── Color palette for charts ────────────────────────────────────
  const COLORS = {
    blue:   '#3b82f6',
    green:  '#10b981',
    amber:  '#f59e0b',
    rose:   '#f43f5e',
    violet: '#8b5cf6',
    cyan:   '#06b6d4',
    grid:   'rgba(255,255,255,0.05)',
    text:   '#94a3b8',
  };

  // ─── Compute analytics from state ───────────────────────────────
  function computeAnalytics() {
    const state = STATE.getState();
    const orders = state.orders;
    const products = state.products;

    // Category breakdown
    const catMap = {};
    products.forEach(p => {
      if (!catMap[p.category]) catMap[p.category] = { count: 0, value: 0, stock: 0 };
      catMap[p.category].count++;
      catMap[p.category].value += p.unitsSold * p.unitPrice;
      catMap[p.category].stock += p.currentStock;
    });

    // Status breakdown
    const statusMap = {};
    orders.forEach(o => {
      statusMap[o.status] = (statusMap[o.status] || 0) + 1;
    });

    // Type breakdown
    const typeMap = {};
    orders.forEach(o => {
      typeMap[o.type] = (typeMap[o.type] || 0) + 1;
    });

    // Revenue by customer tier
    const tierRev = {};
    orders.filter(o => o.status === 'dispatched').forEach(o => {
      const t = o.customer.tier;
      tierRev[t] = (tierRev[t] || 0) + o.totalValue;
    });

    // Fulfillment rate by type
    const typeStats = {};
    orders.forEach(o => {
      if (!typeStats[o.type]) typeStats[o.type] = { total: 0, dispatched: 0 };
      typeStats[o.type].total++;
      if (o.status === 'dispatched') typeStats[o.type].dispatched++;
    });

    return { catMap, statusMap, typeMap, tierRev, typeStats };
  }

  // ─── Helper: DPR-aware canvas setup ─────────────────────────────
  function setupCanvas(canvas, height) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const w = rect.width || canvas.offsetWidth || 400;
    canvas.width = w * dpr;
    canvas.height = height * dpr;
    canvas.style.height = height + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    return { ctx, w, h: height };
  }

  // ─── Line / Area Chart ───────────────────────────────────────────
  function drawLineChart(canvasId, datasets, labels, options = {}) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    const height = options.height || 180;
    const { ctx, w, h } = setupCanvas(canvas, height);
    const padL = 40, padR = 16, padT = 16, padB = 36;
    const chartW = w - padL - padR;
    const chartH = h - padT - padB;

    ctx.clearRect(0, 0, w, h);

    // Find min/max across all datasets
    const allValues = datasets.flatMap(d => d.data);
    const maxVal = Math.max(...allValues, 1);
    const minVal = 0;

    // Grid lines
    const gridCount = 4;
    for (let i = 0; i <= gridCount; i++) {
      const y = padT + chartH - (i / gridCount) * chartH;
      ctx.beginPath();
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 1;
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + chartW, y);
      ctx.stroke();

      // Y-axis labels
      ctx.fillStyle = COLORS.text;
      ctx.font = '10px Inter, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(Math.round((i / gridCount) * maxVal), padL - 6, y + 3);
    }

    // X-axis labels
    if (labels && labels.length > 0) {
      const step = Math.ceil(labels.length / 8);
      ctx.fillStyle = COLORS.text;
      ctx.font = '10px Inter, sans-serif';
      ctx.textAlign = 'center';
      labels.forEach((label, i) => {
        if (i % step === 0 || i === labels.length - 1) {
          const x = padL + (i / (labels.length - 1)) * chartW;
          ctx.fillText(label, x, h - padB + 18);
        }
      });
    }

    // Draw each dataset
    datasets.forEach((dataset, di) => {
      const data = dataset.data;
      if (data.length === 0) return;

      const points = data.map((v, i) => ({
        x: padL + (i / Math.max(data.length - 1, 1)) * chartW,
        y: padT + chartH - ((v - minVal) / (maxVal - minVal)) * chartH,
      }));

      // Area fill
      if (dataset.fill !== false) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, padT + chartH);
        points.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(points[points.length - 1].x, padT + chartH);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, padT, 0, padT + chartH);
        grad.addColorStop(0, dataset.color + '30');
        grad.addColorStop(1, dataset.color + '00');
        ctx.fillStyle = grad;
        ctx.fill();
      }

      // Line
      ctx.beginPath();
      ctx.strokeStyle = dataset.color;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();

      // Dots on last point
      const last = points[points.length - 1];
      ctx.beginPath();
      ctx.arc(last.x, last.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = dataset.color;
      ctx.fill();
      ctx.strokeStyle = '#0d1117';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
  }

  // ─── Bar Chart ───────────────────────────────────────────────────
  function drawBarChart(canvasId, labels, values, colors, options = {}) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    const height = options.height || 180;
    const { ctx, w, h } = setupCanvas(canvas, height);
    const padL = 44, padR = 16, padT = 16, padB = 40;
    const chartW = w - padL - padR;
    const chartH = h - padT - padB;

    ctx.clearRect(0, 0, w, h);

    const maxVal = Math.max(...values, 1);
    const barW = Math.max(8, (chartW / labels.length) * 0.6);
    const gap = chartW / labels.length;

    // Grid
    for (let i = 0; i <= 4; i++) {
      const y = padT + chartH - (i / 4) * chartH;
      ctx.beginPath();
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 1;
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + chartW, y);
      ctx.stroke();
      ctx.fillStyle = COLORS.text;
      ctx.font = '10px Inter, sans-serif';
      ctx.textAlign = 'right';
      const label = options.formatY ? options.formatY(Math.round((i / 4) * maxVal)) : Math.round((i / 4) * maxVal);
      ctx.fillText(label, padL - 6, y + 3);
    }

    labels.forEach((label, i) => {
      const x = padL + gap * i + gap / 2 - barW / 2;
      const barH = (values[i] / maxVal) * chartH;
      const y = padT + chartH - barH;
      const color = Array.isArray(colors) ? colors[i % colors.length] : colors;

      // Bar with rounded top
      const radius = Math.min(5, barW / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + barW - radius, y);
      ctx.arcTo(x + barW, y, x + barW, y + radius, radius);
      ctx.lineTo(x + barW, padT + chartH);
      ctx.lineTo(x, padT + chartH);
      ctx.lineTo(x, y + radius);
      ctx.arcTo(x, y, x + radius, y, radius);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, y, 0, padT + chartH);
      grad.addColorStop(0, color);
      grad.addColorStop(1, color + '60');
      ctx.fillStyle = grad;
      ctx.fill();

      // Label
      ctx.fillStyle = COLORS.text;
      ctx.font = '10px Inter, sans-serif';
      ctx.textAlign = 'center';
      const displayLabel = label.length > 8 ? label.substring(0, 7) + '…' : label;
      ctx.fillText(displayLabel, x + barW / 2, padT + chartH + 16);

      // Value on top
      if (options.showValues !== false) {
        ctx.fillStyle = color;
        ctx.font = '9px Inter, sans-serif';
        ctx.fillText(values[i], x + barW / 2, y - 4);
      }
    });
  }

  // ─── Donut Chart ─────────────────────────────────────────────────
  function drawDonutChart(canvasId, labels, values, colors, options = {}) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    const size = options.size || 160;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    ctx.clearRect(0, 0, size, size);

    const cx = size / 2, cy = size / 2;
    const outerR = size * 0.42;
    const innerR = size * 0.27;
    const total = values.reduce((s, v) => s + v, 0);
    if (total === 0) return;

    let startAngle = -Math.PI / 2;
    const gaps = 0.04;

    values.forEach((v, i) => {
      const sliceAngle = (v / total) * (Math.PI * 2) - gaps;
      ctx.beginPath();
      ctx.arc(cx, cy, outerR, startAngle + gaps / 2, startAngle + sliceAngle + gaps / 2);
      ctx.arc(cx, cy, innerR, startAngle + sliceAngle + gaps / 2, startAngle + gaps / 2, true);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      startAngle += sliceAngle + gaps;
    });

    // Center text
    if (options.centerLabel) {
      ctx.fillStyle = '#f1f5f9';
      ctx.font = `bold ${size * 0.14}px Inter, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(options.centerLabel, cx, cy - size * 0.04);
      ctx.font = `${size * 0.07}px Inter, sans-serif`;
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(options.centerSub || '', cx, cy + size * 0.1);
    }
  }

  // ─── Sparkline ───────────────────────────────────────────────────
  function drawSparkline(canvasId, data, color, height = 36) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    const dpr = window.devicePixelRatio || 1;
    const w = canvas.offsetWidth || 80;
    canvas.width = w * dpr;
    canvas.height = height * dpr;
    canvas.style.height = height + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, height);

    if (data.length < 2) return;

    const maxVal = Math.max(...data, 1);
    const minVal = Math.min(...data, 0);
    const range = maxVal - minVal || 1;
    const pad = 3;

    const points = data.map((v, i) => ({
      x: (i / (data.length - 1)) * w,
      y: height - pad - ((v - minVal) / range) * (height - pad * 2),
    }));

    // Area
    ctx.beginPath();
    ctx.moveTo(points[0].x, height);
    points.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(points[points.length - 1].x, height);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, color + '50');
    grad.addColorStop(1, color + '00');
    ctx.fillStyle = grad;
    ctx.fill();

    // Line
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();
  }

  // ─── Gauge Arc ───────────────────────────────────────────────────
  function drawGauge(canvasId, value, max, color, options = {}) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    const size = options.size || 100;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = (size * 0.6) * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = (size * 0.6) + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, size, size * 0.6);

    const cx = size / 2, cy = size * 0.55;
    const r = size * 0.4;
    const startA = Math.PI;
    const endA = 2 * Math.PI;
    const fillA = startA + (value / max) * Math.PI;

    // Background arc
    ctx.beginPath();
    ctx.arc(cx, cy, r, startA, endA);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Fill arc
    ctx.beginPath();
    ctx.arc(cx, cy, r, startA, fillA);
    ctx.strokeStyle = color;
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Text
    ctx.fillStyle = '#f1f5f9';
    ctx.font = `bold ${size * 0.18}px Inter, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(options.label || `${Math.round((value / max) * 100)}%`, cx, cy - 4);
  }

  return {
    computeAnalytics,
    drawLineChart,
    drawBarChart,
    drawDonutChart,
    drawSparkline,
    drawGauge,
    COLORS,
  };
})();

const UI = (() => {

  // ─── Toast Notification System ───────────────────────────────────
  function toast(title, message, type = 'info', duration = 4000) {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `
      <div class="toast-icon">${icons[type]}</div>
      <div class="toast-body">
        <div class="toast-title">${title}</div>
        ${message ? `<div class="toast-msg">${message}</div>` : ''}
      </div>
      <div class="toast-close" onclick="this.parentElement.remove()">✕</div>
    `;
    container.appendChild(el);
    setTimeout(() => {
      el.classList.add('removing');
      setTimeout(() => el.remove(), 300);
    }, duration);
  }

  // ─── Modal System ────────────────────────────────────────────────
  function openModal(content, title, size = '') {
    const existing = document.getElementById('global-modal');
    if (existing) existing.remove();

    const modal = document.createElement('div');
    modal.id = 'global-modal';
    modal.className = 'modal-backdrop';
    modal.innerHTML = `
      <div class="modal ${size}" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>${title}</h3>
          <div class="modal-close" id="modal-close-btn">✕</div>
        </div>
        <div class="modal-body" id="modal-body">${content}</div>
      </div>
    `;
    document.body.appendChild(modal);
    modal.addEventListener('click', closeModal);
    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
  }

  function closeModal() {
    const modal = document.getElementById('global-modal');
    if (modal) modal.remove();
  }

  // ─── Format helpers ──────────────────────────────────────────────
  function formatINR(amount) {
    return '₹' + Math.round(amount).toLocaleString('en-IN');
  }

  function formatTimeAgo(iso) {
    const d = new Date(iso);
    const diff = (Date.now() - d) / 1000;
    if (diff < 60) return `${Math.floor(diff)}s ago`;
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  function formatDateTime(iso) {
    const d = new Date(iso);
    return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function formatHours(h) {
    if (h < 0) return `<span class="text-rose">Overdue ${Math.abs(h * 60).toFixed(0)}m</span>`;
    if (h < 1) return `<span class="text-rose">${(h * 60).toFixed(0)}m left</span>`;
    if (h < 4) return `<span class="text-amber">${h.toFixed(1)}h left</span>`;
    return `<span class="text-green">${h.toFixed(1)}h left</span>`;
  }

      dispatched: { css: 'badge-green',   icon: '🚚', label: 'Shipped ✓'       },

          <span style="padding:5px 12px;background:rgba(244,63,94,0.12);border-radius:20px;font-size:11px;font-weight:700;color:var(--rose-400);">⚠️ Exceptions</span>

  function kpiCard(icon, label, value, color, trendText, trendDir, sub) {
    return `
      <div class="kpi-card ${color}">
        <div class="kpi-header">
          <div class="kpi-icon">${icon}</div>
          <div class="kpi-trend ${trendDir}">
            ${trendDir === 'up' ? '↑' : trendDir === 'down' ? '↓' : '→'} ${trendText}
          </div>
        </div>
        <div class="kpi-value counter">${value}</div>
        <div class="kpi-label">${label}</div>
        <div class="kpi-sub">${sub}</div>
      </div>`;
  }

  function renderAlertItem(alert) {
    const typeMap = {
      critical: { icon: '🔴', cls: 'critical' },
      warning:  { icon: '🟡', cls: 'warning' },
      info:     { icon: '🔵', cls: 'info' },
    };
    const t = typeMap[alert.severity] || typeMap.info;
    return `
      <div class="alert-item ${t.cls}">
        <div class="alert-icon">${t.icon}</div>
        <div class="alert-body">
          <div class="alert-title">${alert.title}</div>
          <div class="alert-desc">${alert.desc}</div>
          <div class="alert-actions">
            <button class="btn btn-xs ${alert.severity === 'critical' ? 'btn-danger' : 'btn-amber'}" 
              onclick="APP.handleAlertAction('${alert.id}', '${alert.type}', '${alert.skuId || alert.orderId || ''}')">
              ${alert.action}
            </button>
            <button class="btn btn-ghost btn-xs" onclick="this.closest('.alert-item').remove()">Dismiss</button>
          </div>
        </div>
        <div class="alert-time">${formatTimeAgo(alert.time)}</div>
      </div>`;
  }

  function renderActivityItem(item) {
    return `
      <div class="activity-item">
        <div class="activity-dot" style="background:${item.color}"></div>
        <div class="activity-content">
          <p>${item.text}</p>
          <div class="activity-time">${formatTimeAgo(item.time)}</div>
        </div>
      </div>`;
  }

  // ─── Page: Inventory ─────────────────────────────────────────────
  function renderInventory(filter = '', statusFilter = 'all') {
    const state = STATE.getState();
    const reorders = DECISIONS.getReorderRecommendations(state.products);
    let products = state.products;

    if (filter) products = products.filter(p =>
      p.name.toLowerCase().includes(filter.toLowerCase()) ||
      p.id.toLowerCase().includes(filter.toLowerCase()) ||
      p.zone.toLowerCase().includes(filter.toLowerCase()) ||
      p.category.toLowerCase().includes(filter.toLowerCase())
    );

    if (statusFilter !== 'all') products = products.filter(p => p.stockStatus === statusFilter);

    const outOfStock = state.products.filter(p => p.currentStock === 0).length;
    const critical   = state.products.filter(p => p.stockStatus === 'critical').length;
    const lowStock   = state.products.filter(p => p.stockStatus === 'low').length;

    return `
      <div class="page-header">
        <div class="page-header-left">
          <h2>📦 Inventory Intelligence</h2>
          <p>${state.products.length} SKUs across 6 zones • ${outOfStock} out-of-stock • ${critical + lowStock} need attention</p>
        </div>
        <div class="page-header-right">
          <button class="btn btn-ghost" onclick="APP.showAdjustStockModal()">🔧 Adjust Stock</button>
          <button class="btn btn-primary" onclick="APP.showReorderModal()">📋 Reorder (${reorders.length})</button>
        </div>
      </div>

      <!-- Inventory KPIs -->
      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px;">
        <div class="kpi-card rose" style="padding:14px;">
          <div style="font-size:28px;font-weight:800;">${outOfStock}</div>
          <div style="font-size:12px;color:var(--text-secondary);">Out of Stock</div>
        </div>
        <div class="kpi-card amber" style="padding:14px;">
          <div style="font-size:28px;font-weight:800;">${critical}</div>
          <div style="font-size:12px;color:var(--text-secondary);">Critical Stock</div>
        </div>
        <div class="kpi-card amber" style="padding:14px;">
          <div style="font-size:28px;font-weight:800;">${lowStock}</div>
          <div style="font-size:12px;color:var(--text-secondary);">Low Stock</div>
        </div>
        <div class="kpi-card green" style="padding:14px;">
          <div style="font-size:28px;font-weight:800;">${state.products.filter(p => p.stockStatus === 'good').length}</div>
          <div style="font-size:12px;color:var(--text-secondary);">Healthy Stock</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <div class="search-wrapper">
          <input class="search-input" id="inv-search" placeholder="Search SKU, name, zone, category..." 
            value="${filter}" oninput="APP.filterInventory(this.value, document.getElementById('inv-status').value)">
        </div>
        <select class="filter-select" id="inv-status" onchange="APP.filterInventory(document.getElementById('inv-search').value, this.value)">
          <option value="all" ${statusFilter==='all'?'selected':''}>All Status</option>
          <option value="out-of-stock" ${statusFilter==='out-of-stock'?'selected':''}>🔴 Out of Stock</option>
          <option value="critical" ${statusFilter==='critical'?'selected':''}>🟠 Critical</option>
          <option value="low" ${statusFilter==='low'?'selected':''}>🟡 Low Stock</option>
          <option value="good" ${statusFilter==='good'?'selected':''}>🟢 Good</option>
        </select>
        <select class="filter-select" onchange="APP.filterInventoryZone(this.value)">
          <option value="all">All Zones</option>
          ${['A','B','C','D','E','F'].map(z => `<option value="${z}">Zone ${z}</option>`).join('')}
        </select>
      </div>

      <!-- Products Table -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>SKU / Name</th>
              <th>Zone / Bin</th>
              <th>Category</th>
              <th>Stock Level</th>
              <th>Status</th>
              <th>Unit Price</th>
              <th>Last Restocked</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${products.map(p => `
              <tr>
                <td>
                  <div class="font-mono text-xs text-secondary">${p.id}</div>
                  <div class="font-600 text-sm">${p.name}</div>
                </td>
                <td>
                  <span class="badge zone-${p.zone}" style="margin-bottom:3px;">Zone ${p.zone}</span><br>
                  <span class="font-mono text-xs text-muted">${p.bin}</span>
                </td>
                <td><span class="tag">${p.category}</span></td>
                <td>
                  <div class="stock-gauge">
                    <div class="stock-bar">
                      <div class="stock-fill ${p.stockStatus === 'out-of-stock' ? 'critical' : p.stockStatus}" style="width:${p.stockPct}%"></div>
                    </div>
                    <span class="font-mono text-xs" style="min-width:60px;text-align:right;">
                      <strong>${p.currentStock}</strong><span class="text-muted">/${p.maxCapacity}</span>
                    </span>
                  </div>
                  <div class="text-xs text-muted" style="margin-top:2px;">Reorder at ${p.reorderPoint} • Safety: ${p.safetyStock}</div>
                </td>
                <td>${statusBadge(p.stockStatus)}</td>
                <td class="font-mono">${formatINR(p.unitPrice)}</td>
                <td class="text-sm text-secondary">${formatTimeAgo(p.lastRestocked)}</td>
                <td>
                  <div style="display:flex;gap:4px;flex-wrap:wrap;">
                    <button class="btn btn-xs btn-ghost" onclick="APP.showProductDetail('${p.id}')">Detail</button>
                    <button class="btn btn-xs btn-primary" onclick="APP.showAdjustStockModal('${p.id}')">Adjust</button>
                    ${p.currentStock <= p.reorderPoint ? `<button class="btn btn-xs btn-amber" onclick="APP.quickReorder('${p.id}')">Reorder</button>` : ''}
                  </div>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${products.length === 0 ? '<div class="empty-state"><div class="empty-icon">📭</div><h3>No products found</h3><p>Try a different search or filter</p></div>' : ''}
    `;
  }

  // ─── Page: Orders ─────────────────────────────────────────────────
  function renderOrders(filter = '', statusFilter = 'all', typeFilter = 'all') {
    const state = STATE.getState();
    let orders = DECISIONS.sortOrdersByPriority(state.orders);

    if (filter) orders = orders.filter(o =>
      o.id.includes(filter) || o.customer.name.toLowerCase().includes(filter.toLowerCase())
    );
    if (statusFilter !== 'all') orders = orders.filter(o => o.status === statusFilter);
    if (typeFilter !== 'all') orders = orders.filter(o => o.type === typeFilter);

    const active = state.orders.filter(o => !['dispatched', 'exception'].includes(o.status)).length;
    const conflicts = state.orders.filter(o => o.isConflict && o.status !== 'dispatched').length;
    const totalRevenue = state.orders.filter(o => o.status === 'dispatched').reduce((s,o) => s + o.totalValue, 0);
    const pendingRevenue = state.orders.filter(o => !['dispatched','exception'].includes(o.status)).reduce((s,o) => s + o.totalValue, 0);

    return `
      <div class="page-header">
        <div class="page-header-left">
          <h2>🛒 Customer Orders</h2>
          <p>${state.orders.length} total orders in system • ${active} being actively processed • ${conflicts} have stock problems • 👇 Click any row to see full order details + price breakdown</p>
        </div>
        <div class="page-header-right">
          <button class="btn btn-ghost" onclick="APP.showBulkActionModal()">⚡ Bulk Process Orders</button>
          <button class="btn btn-primary" onclick="APP.showCreateOrderModal()">+ Create New Order</button>
        </div>
      </div>

      <!-- Revenue Summary Strip -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;">
        <div class="kpi-card green" style="padding:14px;">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.7px;">Money Earned (Shipped Orders)</div>
          <div style="font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--green-400);">${formatINR(totalRevenue)}</div>
        </div>
        <div class="kpi-card blue" style="padding:14px;">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.7px;">Expected Income (In-Progress)</div>
          <div style="font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--blue-400);">${formatINR(pendingRevenue)}</div>
        </div>
        ${['VIP','Express'].map(type => {
          const cnt = state.orders.filter(o => o.type === type && o.status !== 'dispatched').length;
          const val = state.orders.filter(o => o.type === type && o.status !== 'dispatched').reduce((s,o)=>s+o.totalValue,0);
          const colorMap = { VIP: 'rose', Express: 'amber' };
          const iconMap = { VIP: '👑', Express: '⚡' };
          return `<div class="kpi-card ${colorMap[type]}" style="padding:14px;cursor:pointer;" onclick="APP.filterOrders('','all','${type}')">
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.7px;">${iconMap[type]} ${type} Orders</div>
            <div style="font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace;">${formatINR(val)}</div>
            <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${cnt} active</div>
          </div>`;
        }).join('')}
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <div class="search-wrapper">
          <input class="search-input" id="ord-search" placeholder="Search order ID, customer..." 
            value="${filter}" oninput="APP.filterOrders(this.value, document.getElementById('ord-status').value, document.getElementById('ord-type').value)">
        </div>
        <select class="filter-select" id="ord-status" onchange="APP.filterOrders(document.getElementById('ord-search').value, this.value, document.getElementById('ord-type').value)">
          <option value="all" ${statusFilter==='all'?'selected':''}>All Status</option>
          <option value="created" ${statusFilter==='created'?'selected':''}>Created</option>
          <option value="allocated" ${statusFilter==='allocated'?'selected':''}>Allocated</option>
          <option value="picking" ${statusFilter==='picking'?'selected':''}>Picking</option>
          <option value="packing" ${statusFilter==='packing'?'selected':''}>Packing</option>
          <option value="qc" ${statusFilter==='qc'?'selected':''}>QC</option>
          <option value="dispatched" ${statusFilter==='dispatched'?'selected':''}>Dispatched</option>
          <option value="exception" ${statusFilter==='exception'?'selected':''}>Exception</option>
        </select>
        <select class="filter-select" id="ord-type" onchange="APP.filterOrders(document.getElementById('ord-search').value, document.getElementById('ord-status').value, this.value)">
          <option value="all" ${typeFilter==='all'?'selected':''}>All Types</option>
          <option value="VIP" ${typeFilter==='VIP'?'selected':''}>👑 VIP</option>
          <option value="Express" ${typeFilter==='Express'?'selected':''}>⚡ Express</option>
          <option value="Standard" ${typeFilter==='Standard'?'selected':''}>📦 Standard</option>
          <option value="Bulk" ${typeFilter==='Bulk'?'selected':''}>🏭 Bulk</option>
        </select>
      </div>
      <!-- Split layout: table left, selected-order panel right -->
      <div id="orders-split" style="display:grid;grid-template-columns:1fr;gap:20px;transition:grid-template-columns 0.35s ease;">
        <div>
          <div class="table-wrapper">
            <table id="orders-table">
              <thead>
                <tr>
                  <th style="width:28px;"></th>
                  <th>Order ID</th>
                  <th>Order Type<br><span style="font-size:9px;font-weight:400;color:var(--text-muted);">(VIP = fastest priority)</span></th>
                  <th>Customer</th>
                  <th>Products Ordered</th>
                  <th style="color:var(--green-400);">💰 Total Bill (₹)</th>
                  <th style="color:var(--rose-400);">↩ Items Returned</th>
                  <th>Current Stage</th>
                  <th>Delivery Deadline<br><span style="font-size:9px;font-weight:400;color:var(--text-muted);">(time remaining)</span></th>
                  <th>Urgency Score<br><span style="font-size:9px;font-weight:400;color:var(--text-muted);">(100 = most urgent)</span></th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="orders-tbody">
                ${orders.slice(0, 60).map(o => {
                  const ret = state.returns ? state.returns.filter(r => r.orderId === o.id) : [];
                  const retQty  = ret.reduce((s, r) => s + r.qty, 0);
                  const retAmt  = ret.reduce((s, r) => s + r.refundAmt, 0);
                  const hasOpen = ret.some(r => r.status === 'pending' || r.status === 'inspecting');
                  return `
                  <tr id="ord-row-${o.id}"
                    style="cursor:pointer;${o.isConflict && o.status !== 'dispatched' ? 'background:rgba(244,63,94,0.04);' : ''}"
                    onclick="APP.selectOrder('${o.id}')">
                    <td style="padding-left:14px;">
                      <div id="ord-check-${o.id}" style="width:18px;height:18px;border-radius:50%;border:2px solid var(--border-default);display:flex;align-items:center;justify-content:center;font-size:10px;transition:all 0.2s ease;"></div>
                    </td>
                    <td>
                      <div class="font-mono font-600">${o.id}</div>
                      ${o.isConflict && o.status !== 'dispatched' ? '<div class="text-xs text-rose">⚠ Stock Conflict</div>' : ''}
                      ${o.trackingId ? `<div class="font-mono text-xs text-muted">${o.trackingId}</div>` : ''}
                    </td>
                    <td>${priorityBadge(o.type)}</td>
                    <td>
                      <div class="font-600 text-sm">${o.customer.name.substring(0,18)}${o.customer.name.length>18?'…':''}</div>
                      <span class="tag">${o.customer.tier}</span>
                    </td>
                    <td>
                      <div class="text-sm">${o.items.length} item${o.items.length>1?'s':''}</div>
                      <div class="text-xs text-muted" style="max-width:110px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${o.items[0]?.skuName?.substring(0,16)}${o.items.length>1?` +${o.items.length-1}`:''}</div>
                    </td>
                    <td>
                      <div style="font-size:14px;font-weight:800;color:var(--green-400);font-family:'JetBrains Mono',monospace;">${formatINR(o.totalValue)}</div>
                      <div style="font-size:10px;color:var(--text-muted);">${o.items.reduce((s,i)=>s+i.qty,0)} units</div>
                    </td>
                    <td>
                      ${ret.length === 0
                        ? '<span style="font-size:12px;color:var(--text-muted);">—</span>'
                        : `<div style="display:flex;flex-direction:column;gap:2px;">
                            <div style="font-size:12px;font-weight:700;color:${hasOpen?'var(--amber-400)':'var(--rose-400)'};">
                              ↩ ${retQty} unit${retQty>1?'s':''}
                            </div>
                            <div style="font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;">${formatINR(retAmt)}</div>
                            ${hasOpen ? '<span style="font-size:9px;background:rgba(245,158,11,0.15);color:var(--amber-400);border-radius:4px;padding:1px 5px;font-weight:700;">OPEN</span>' : '<span style="font-size:9px;background:rgba(16,185,129,0.12);color:var(--green-400);border-radius:4px;padding:1px 5px;font-weight:700;">CLOSED</span>'}
                           </div>`
                      }
                    </td>
                    <td>${statusBadge(o.status)}</td>
                    <td class="text-sm">${formatHours(o.hoursToSla)}</td>
                    <td>${scoreBar(o.priorityScore)}</td>
                    <td onclick="event.stopPropagation()">
                      <div style="display:flex;gap:4px;">
                        <button class="btn btn-xs btn-ghost" onclick="APP.showOrderDetail('${o.id}')">🔍</button>
                        ${o.status !== 'dispatched' && o.status !== 'exception' ? `
                          <button class="btn btn-xs btn-primary" onclick="APP.advanceOrder('${o.id}')">→</button>
                          ${o.isConflict ? `<button class="btn btn-xs btn-amber" onclick="APP.showConflictResolution('${o.id}')">⚡</button>` : ''}
                        ` : ''}
                        ${ret.length > 0 ? `<button class="btn btn-xs btn-ghost" style="color:var(--rose-400);" onclick="APP.showReturnsForOrder('${o.id}')">↩${ret.length}</button>` : ''}
                      </div>
                    </td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
          ${orders.length === 0 ? '<div class="empty-state"><div class="empty-icon">📭</div><h3>No orders match your filter</h3></div>' : ''}
        </div>

        <!-- Selected Order Panel (hidden until row clicked) -->
        <div id="selected-order-panel" style="display:none;"></div>
      </div>
    `;
  }

  // ─── Selected Order Price Panel ──────────────────────────────────────
  function renderSelectedOrderPanel(orderId) {
    const state = STATE.getState();
    const o = STATE.getOrder(orderId);
    if (!o) return '';

    const lifecycle = ['created','allocated','picking','packing','qc','dispatched'];
    const currentIdx = lifecycle.indexOf(o.status);
    const subtotal = o.items.reduce((s,i) => s + i.qty * i.unitPrice, 0);
    const tax      = Math.round(subtotal * 0.18);
    const total    = subtotal + tax;
    const lcIcons  = { created:'📝', allocated:'📋', picking:'👷', packing:'📦', qc:'🔍', dispatched:'🚚' };
    const nextStage = lifecycle[currentIdx + 1];

    // Returns for this order
    const rets = (state.returns || []).filter(r => r.orderId === o.id);
    const retQty = rets.reduce((s,r) => s+r.qty, 0);
    const retAmt = rets.reduce((s,r) => s+r.refundAmt, 0);

    const condColor = {
      'Resaleable':       'var(--green-400)',
      'Sealed / Unopened':'var(--blue-400)',
      'Partially Used':   'var(--amber-400)',
      'Damaged':          'var(--rose-400)',
    };
    const retStatusColor = {
      pending:    'var(--amber-400)',
      inspecting: 'var(--blue-400)',
      restocked:  'var(--green-400)',
      disposed:   'var(--rose-400)',
      refunded:   'var(--purple-400)',
    };

    return `
      <div style="background:var(--bg-elevated);border:1px solid rgba(59,130,246,0.2);border-radius:var(--radius-lg);position:sticky;top:88px;overflow:hidden;box-shadow:0 0 30px rgba(59,130,246,0.08);animation:slideInRight 0.3s cubic-bezier(0.34,1.56,0.64,1);">

        <!-- Header -->
        <div style="background:linear-gradient(135deg,rgba(59,130,246,0.14),rgba(139,92,246,0.08));border-bottom:1px solid var(--border-subtle);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue-400);margin-bottom:3px;">🎯 Selected Order</div>
            <div style="font-size:16px;font-weight:800;font-family:'JetBrains Mono',monospace;">${o.id}</div>
          </div>
          <button onclick="APP.deselectOrder()" style="background:var(--bg-overlay);border:1px solid var(--border-subtle);border-radius:var(--radius-md);width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);">✕</button>
        </div>

        <!-- Badges -->
        <div style="padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border-subtle);">
          ${priorityBadge(o.type)}
          ${statusBadge(o.status)}
          ${o.isConflict && o.status !== 'dispatched' ? '<span class="badge badge-rose">⚠ Conflict</span>' : ''}
          ${rets.length > 0 ? `<span class="badge" style="background:rgba(244,63,94,0.15);color:var(--rose-400);">↩ ${retQty} returned</span>` : ''}
        </div>

        <!-- Lifecycle -->
        <div style="padding:12px 16px;border-bottom:1px solid var(--border-subtle);">
          <div style="display:flex;align-items:flex-start;">
            ${lifecycle.map((stage, i) => {
              const done   = i < currentIdx;
              const active = i === currentIdx;
              const dotBg  = done ? 'var(--green-500)' : active ? 'var(--blue-500)' : 'var(--bg-overlay)';
              const dotBdr = done ? 'var(--green-400)' : active ? 'var(--blue-400)' : 'var(--border-default)';
              const txtClr = done ? 'var(--green-400)' : active ? 'var(--blue-400)' : 'var(--text-muted)';
              return `
                ${i > 0 ? `<div style="flex:1;height:2px;background:${done?'var(--green-500)':'var(--border-subtle)'};margin-top:10px;"></div>` : ''}
                <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
                  <div style="width:22px;height:22px;border-radius:50%;background:${dotBg};border:2px solid ${dotBdr};display:flex;align-items:center;justify-content:center;font-size:9px;${active?'box-shadow:0 0 0 3px rgba(59,130,246,0.25);':''}">
                    ${done ? '<span style="color:#fff;font-weight:700;font-size:9px;">✓</span>' : `<span>${lcIcons[stage]}</span>`}
                  </div>
                  <div style="font-size:8px;font-weight:600;color:${txtClr};text-transform:capitalize;white-space:nowrap;">${stage}</div>
                </div>`;
            }).join('')}
          </div>
        </div>

        <!-- Customer -->
        <div style="padding:12px 16px;border-bottom:1px solid var(--border-subtle);">
          <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);margin-bottom:6px;">👤 Customer</div>
          <div style="font-size:13px;font-weight:700;">${o.customer.name}</div>
          <div style="display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;">
            <span class="tag">${o.customer.tier}</span>
            <span class="tag">📍 ${o.customer.city}</span>
            <span class="tag">🚚 ${o.carrier}</span>
          </div>
        </div>

        <!-- Items -->
        <div style="padding:12px 16px;border-bottom:1px solid var(--border-subtle);">
          <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);margin-bottom:8px;">📦 Line Items</div>
          ${o.items.map(item => `
            <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;padding:8px 10px;background:var(--bg-overlay);border-radius:var(--radius-md);border:1px solid var(--border-subtle);">
              <span class="badge zone-${item.zone}" style="flex-shrink:0;font-size:9px;">Z${item.zone}</span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:11px;font-weight:600;line-height:1.3;">${item.skuName}</div>
                <div style="display:flex;justify-content:space-between;margin-top:4px;">
                  <span style="font-size:10px;color:var(--text-muted);">${formatINR(item.unitPrice)} × ${item.qty}</span>
                  <span style="font-size:12px;font-weight:800;font-family:'JetBrains Mono',monospace;">${formatINR(item.qty*item.unitPrice)}</span>
                </div>
              </div>
            </div>`).join('')}
        </div>

        <!-- 💰 Price Breakdown -->
        <div style="padding:14px 16px;border-bottom:1px solid var(--border-subtle);background:rgba(16,185,129,0.05);">
          <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);margin-bottom:10px;">💰 Price Breakdown</div>
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <span style="font-size:12px;color:var(--text-secondary);">Subtotal (${o.items.reduce((s,i)=>s+i.qty,0)} units)</span>
            <span style="font-size:12px;font-family:'JetBrains Mono',monospace;">${formatINR(subtotal)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <span style="font-size:12px;color:var(--text-secondary);">GST @ 18%</span>
            <span style="font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--amber-400);">+ ${formatINR(tax)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <span style="font-size:12px;color:var(--text-secondary);">Shipping</span>
            <span style="font-size:12px;color:var(--green-400);font-weight:600;">FREE</span>
          </div>
          ${retAmt > 0 ? `
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <span style="font-size:12px;color:var(--rose-400);">↩ Returns Refunded</span>
            <span style="font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--rose-400);">− ${formatINR(retAmt)}</span>
          </div>` : ''}
          <div style="height:1px;background:var(--border-default);margin:8px 0;"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:13px;font-weight:700;">${retAmt>0 ? 'Net Total' : 'Order Total'}</span>
            <span style="font-size:22px;font-weight:900;color:var(--green-400);font-family:'JetBrains Mono',monospace;letter-spacing:-1px;">${formatINR(total - retAmt)}</span>
          </div>
          ${retAmt > 0 ? `<div style="font-size:10px;color:var(--rose-400);text-align:right;margin-top:3px;">Gross: ${formatINR(total)} − Returns: ${formatINR(retAmt)}</div>` : ''}
        </div>

        <!-- ↩ Returns Summary (shown only if returns exist) -->
        ${rets.length > 0 ? `
        <div style="padding:12px 16px;border-bottom:1px solid var(--border-subtle);background:rgba(244,63,94,0.04);">
          <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--rose-400);margin-bottom:8px;">↩ Returned Items (${rets.length})</div>
          ${rets.map(r => `
            <div style="padding:8px 10px;background:var(--bg-overlay);border-radius:var(--radius-md);border:1px solid rgba(244,63,94,0.15);margin-bottom:6px;">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                <div style="flex:1;min-width:0;">
                  <div style="font-size:11px;font-weight:600;">${r.skuName}</div>
                  <div style="font-size:10px;color:var(--text-muted);margin-top:2px;">${r.reason}</div>
                </div>
                <div style="text-align:right;flex-shrink:0;">
                  <div style="font-size:11px;font-weight:700;color:var(--rose-400);">−${formatINR(r.refundAmt)}</div>
                  <div style="font-size:10px;color:var(--text-muted);">${r.qty} unit${r.qty>1?'s':''}</div>
                </div>
              </div>
              <div style="display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;">
                <span style="font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;background:rgba(244,63,94,0.1);color:${condColor[r.condition]||'var(--text-secondary)'};">${r.condition}</span>
                <span style="font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;background:var(--bg-elevated);color:${retStatusColor[r.status]||'var(--text-secondary)'};">${r.status.toUpperCase()}</span>
              </div>
            </div>`).join('')}
        </div>` : ''}

        <!-- SLA -->
        <div style="padding:10px 16px;border-bottom:1px solid var(--border-subtle);display:flex;gap:10px;">
          <div style="flex:1;text-align:center;padding:8px;background:var(--bg-overlay);border-radius:var(--radius-md);">
            <div style="font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">SLA Left</div>
            <div style="font-size:12px;font-weight:700;margin-top:3px;">${formatHours(o.hoursToSla)}</div>
          </div>
          <div style="flex:1;text-align:center;padding:8px;background:var(--bg-overlay);border-radius:var(--radius-md);">
            <div style="font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Priority</div>
            <div style="font-size:12px;font-weight:700;color:var(--blue-400);margin-top:3px;">${o.priorityScore}/100</div>
          </div>
        </div>

        <!-- Actions -->
        <div style="padding:12px 16px;display:flex;flex-direction:column;gap:7px;">
          ${o.status !== 'dispatched' && o.status !== 'exception' ? `
            <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="APP.advanceOrder('${o.id}')">→ Advance to ${nextStage ? nextStage.charAt(0).toUpperCase()+nextStage.slice(1) : '✓ Complete'}</button>
            ${o.isConflict ? `<button class="btn btn-amber" style="width:100%;justify-content:center;" onclick="APP.showConflictResolution('${o.id}')">⚡ Resolve Conflict</button>` : ''}
          ` : o.status === 'dispatched' ? `
            <div style="text-align:center;padding:8px;background:rgba(16,185,129,0.08);border-radius:var(--radius-md);border:1px solid rgba(16,185,129,0.2);">
              <div style="font-size:16px;">✅</div>
              <div style="font-size:11px;font-weight:700;color:var(--green-400);">Dispatched</div>
              ${o.trackingId ? `<div style="font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;">${o.trackingId}</div>` : ''}
            </div>` : ''}
          ${rets.length > 0 ? `<button class="btn btn-ghost" style="width:100%;justify-content:center;color:var(--rose-400);border-color:rgba(244,63,94,0.3);" onclick="APP.navigate('returns')">↩ Manage Returns (${rets.length})</button>` : ''}
          <button class="btn btn-ghost" style="width:100%;justify-content:center;" onclick="APP.showOrderDetail('${o.id}')">🔍 Full Detail</button>
        </div>
      </div>
    `;
  }


  // ─── Page: Picking ───────────────────────────────────────────────
  function renderPicking() {
    const state = STATE.getState();
    const pickingOrders = state.orders.filter(o => o.status === 'picking');
    const allocatedOrders = state.orders.filter(o => o.status === 'allocated').slice(0, 5);

    return `
      <div class="page-header">
        <div class="page-header-left">
          <h2>👷 Picking & Packing Operations</h2>
          <p>${pickingOrders.length} active pick lists • ${allocatedOrders.length} ready to pick</p>
        </div>
        <div class="page-header-right">
          <button class="btn btn-ghost" onclick="APP.generatePickLists()">📋 Generate Pick Lists</button>
          <button class="btn btn-primary" onclick="APP.assignWorkers()">👷 Assign Workers</button>
        </div>
      </div>

      <div class="grid-21">
        <!-- Active Pick Lists -->
        <div>
          <div class="card mb-20">
            <div class="card-header">
              <div class="card-title">⚡ Active Pick Lists (${pickingOrders.length})</div>
              <span class="pulse-live">Live</span>
            </div>
            <div class="card-body">
              ${pickingOrders.length === 0 ? `
                <div class="empty-state" style="padding:30px;">
                  <div class="empty-icon">👷</div>
                  <h3>No active pick lists</h3>
                  <p>Advance allocated orders to start picking</p>
                </div>` : ''}
              ${pickingOrders.slice(0, 8).map(o => {
                const optimizedItems = DECISIONS.optimizePickPath(o.items);
                const worker = state.workers.find(w => w.id === o.pickerAssigned);
                return `
                  <div class="pick-card mb-12">
                    <div style="display:flex;align-items:flex-start;justify-content:space-between;">
                      <div>
                        ${priorityBadge(o.type)}
                        <span class="font-mono font-600 text-sm" style="margin-left:8px;">${o.id}</span>
                        <div class="text-xs text-secondary" style="margin-top:4px;">${o.customer.name} • ${formatHours(o.hoursToSla)}</div>
                      </div>
                      <div style="text-align:right;">
                        ${worker ? `<div style="font-size:11px;color:var(--text-secondary);">Picker: ${worker.name}</div>` : ''}
                        <div class="text-xs text-muted">${o.items.reduce((s, i) => s + i.qty, 0)} units</div>
                      </div>
                    </div>
                    <div class="pick-items">
                      ${optimizedItems.map((item, idx) => `
                        <div class="pick-item" id="pick-item-${o.id}-${idx}" onclick="APP.scanPickItem('${o.id}', ${idx})">
                          <span class="badge zone-${item.zone}" style="flex-shrink:0;">Zone ${item.zone}</span>
                          <div style="flex:1;min-width:0;">
                            <div class="text-sm font-600 truncate">${item.skuName}</div>
                            <div class="font-mono text-xs text-muted">${item.bin} • Qty: ${item.qty}</div>
                          </div>
                          <button class="scan-btn">Scan ✓</button>
                        </div>`).join('')}
                    </div>
                    <div style="display:flex;gap:8px;margin-top:12px;">
