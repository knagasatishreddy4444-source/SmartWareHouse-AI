  // ─── Page: Exceptions ────────────────────────────────────────────
  function renderExceptions() {
    const state = STATE.getState();
    const open = state.exceptions.filter(e => e.status === 'open');
    const inProgress = state.exceptions.filter(e => e.status === 'in-progress');
    const resolved = state.exceptions.filter(e => e.status === 'resolved');

    return `
      <div class="page-header">
        <div class="page-header-left">
          <h2>⚠️ Exception Management</h2>
          <p>${open.length} open • ${inProgress.length} in-progress • ${resolved.length} resolved</p>
        </div>
        <div class="page-header-right">
          <button class="btn btn-primary" onclick="APP.showCreateExceptionModal()">+ Flag Exception</button>
        </div>
      </div>

      <div class="tabs" style="margin-bottom:20px;">
        <div class="tab active" id="exc-tab-open" onclick="APP.switchExcTab('open')">🔴 Open (${open.length})</div>
        <div class="tab" id="exc-tab-in-progress" onclick="APP.switchExcTab('in-progress')">🟡 In Progress (${inProgress.length})</div>
        <div class="tab" id="exc-tab-resolved" onclick="APP.switchExcTab('resolved')">🟢 Resolved (${resolved.length})</div>
      </div>

      <div id="exc-list">
        ${[...open, ...inProgress].map(exc => renderExceptionCard(exc)).join('')}

  function renderExceptionCard(exc) {
    const prod = STATE.getProduct(exc.skuId);
    const typeIcons = { damaged: '💥', 'short-pick': '📉', mislabeled: '🏷️', missing: '❓', overstock: '📦', expired: '⏰' };
    const statusColors = { open: 'rose', 'in-progress': 'amber', resolved: 'green' };

    return `
      <div class="card mb-16">
        <div class="card-header">
          <div class="card-title" style="gap:10px;">
            <span>${typeIcons[exc.type] || '⚠️'}</span>
            ${exc.id} — ${exc.type.toUpperCase()}
            ${severityBadge(exc.severity)}
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            ${statusBadge(exc.status)}
            <span class="text-xs text-muted">${formatTimeAgo(exc.createdAt)}</span>
          </div>
        </div>
        <div class="card-body">
          <div class="grid-2" style="margin-bottom:16px;">
            <div>
              <div class="detail-item">
                <div class="detail-label">Affected SKU</div>
                <div class="detail-val">${prod ? prod.name : exc.skuId}</div>
              </div>
            </div>
            <div>
              <div class="detail-item">
                <div class="detail-label">Order Reference</div>
                <div class="detail-val font-mono">${exc.orderId || 'N/A'}</div>
              </div>
            </div>
          </div>

          <div style="margin-bottom:14px;">
            <div class="detail-label">Description</div>
            <div class="text-sm text-secondary" style="margin-top:4px;">${exc.description}</div>
          </div>

          <div class="decision-card" style="margin-bottom:14px;">
            <div class="decision-title" style="font-size:13px;">🧠 Recommended Action</div>
            <div class="decision-desc" style="font-size:12px;">${exc.suggestedAction}</div>
          </div>

          ${exc.status !== 'resolved' ? `
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-success btn-sm" onclick="APP.resolveException('${exc.id}', '${exc.suggestedAction.substring(0, 50)}')">
                ✓ Accept & Resolve
              </button>
              <button class="btn btn-ghost btn-sm" onclick="APP.showResolveExceptionModal('${exc.id}')">
                ✏ Custom Resolution
              </button>
              ${exc.status === 'open' ? `<button class="btn btn-amber btn-sm" onclick="APP.escalateException('${exc.id}')">⬆ Escalate</button>` : ''}
            </div>` : `
            <div style="color:var(--green-400);font-size:13px;font-weight:600;">✅ Resolved: ${exc.resolution || 'Auto-resolved'}</div>
            <div class="text-xs text-muted" style="margin-top:4px;">Resolved ${formatTimeAgo(exc.resolvedAt)}</div>
          `}
        </div>
      </div>`;
  }

  // ─── Modal Contents ──────────────────────────────────────────────
  function orderDetailModal(orderId) {
    const o = STATE.getOrder(orderId);
    if (!o) return '<p>Order not found</p>';

    const lifecycle = ['created', 'allocated', 'picking', 'packing', 'qc', 'dispatched'];
    const currentIdx = lifecycle.indexOf(o.status);

    return `
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;">
        ${priorityBadge(o.type)} ${statusBadge(o.status)}
        ${o.isConflict ? '<span class="badge badge-rose">⚠ Stock Conflict</span>' : ''}
      </div>

      <!-- Lifecycle -->
      <div class="card mb-16">
        <div class="card-body" style="padding:16px;">
          <div class="lifecycle">
            ${lifecycle.map((stage, i) => {
              const state = i < currentIdx ? 'done' : i === currentIdx ? 'active' : 'pending';
              const icons = { created:'📝', allocated:'📋', picking:'👷', packing:'📦', qc:'🔍', dispatched:'🚚' };
              return `
                ${i > 0 ? `<div class="lc-line ${i <= currentIdx ? 'done' : ''}"></div>` : ''}
                <div class="lc-step ${state}">
                  <div class="lc-dot">${icons[stage]}</div>
                  <div class="lc-label">${stage.charAt(0).toUpperCase()+stage.slice(1)}</div>
                </div>`;
            }).join('')}
          </div>
        </div>
      </div>

      <div class="detail-grid mb-16">
        <div class="detail-item"><div class="detail-label">Order ID</div><div class="detail-val font-mono">${o.id}</div></div>
        <div class="detail-item"><div class="detail-label">Customer</div><div class="detail-val">${o.customer.name}</div></div>
        <div class="detail-item"><div class="detail-label">Customer Tier</div><div class="detail-val">${o.customer.tier}</div></div>
        <div class="detail-item"><div class="detail-label">Carrier</div><div class="detail-val">${o.carrier}</div></div>
        <div class="detail-item"><div class="detail-label">Created</div><div class="detail-val">${formatDateTime(o.createdAt)}</div></div>
        <div class="detail-item"><div class="detail-label">SLA Deadline</div><div class="detail-val">${formatDateTime(o.slaDeadline)}</div></div>
        <div class="detail-item"><div class="detail-label">Priority Score</div><div class="detail-val">${scoreBar(o.priorityScore)}</div></div>
        <div class="detail-item"><div class="detail-label">Total Value</div><div class="detail-val font-mono" style="color:var(--green-400);">${formatINR(o.totalValue)}</div></div>
        ${o.trackingId ? `<div class="detail-item"><div class="detail-label">Tracking</div><div class="detail-val font-mono">${o.trackingId}</div></div>` : ''}
      </div>

      <div class="card mb-16">
        <div class="card-header"><div class="card-title">📦 Order Items</div></div>
        <div class="table-wrapper" style="border:none;">
          <table>
            <thead><tr><th>SKU</th><th>Product</th><th>Zone/Bin</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead>
            <tbody>
              ${o.items.map(item => `
                <tr>
                  <td class="font-mono text-xs">${item.skuId}</td>
                  <td class="font-600 text-sm">${item.skuName}</td>
                  <td><span class="badge zone-${item.zone}">Zone ${item.zone}</span> <span class="font-mono text-xs">${item.bin}</span></td>
                  <td class="font-mono">${item.qty}</td>
                  <td class="font-mono">${formatINR(item.unitPrice)}</td>
                  <td class="font-mono font-600">${formatINR(item.qty * item.unitPrice)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${o.status !== 'dispatched' && o.status !== 'exception' ? `
          <button class="btn btn-primary" onclick="APP.advanceOrder('${o.id}'); UI.closeModal();">→ Advance Status</button>
          ${o.isConflict ? `<button class="btn btn-amber" onclick="UI.closeModal(); APP.showConflictResolution('${o.id}');">⚡ Resolve Conflict</button>` : ''}
          <button class="btn btn-danger" onclick="APP.cancelOrder('${o.id}'); UI.closeModal();">✕ Cancel Order</button>` : ''}
        <button class="btn btn-ghost" onclick="UI.closeModal()">Close</button>
      </div>
    `;
  }

  function conflictResolutionModal(resolution) {
    if (!resolution) return '<p>No conflict found for this order.</p>';

    return `
      <div style="margin-bottom:16px;">
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          ${priorityBadge(resolution.orderType)}
          <span class="badge badge-rose">⚠ ${resolution.decisions.length} Conflict${resolution.decisions.length > 1 ? 's' : ''}</span>
          <span class="badge badge-blue">Confidence: ${resolution.confidence}</span>
        </div>
        <div class="text-sm text-secondary">Customer: ${resolution.customer.name} (${resolution.customer.tier})</div>
      </div>

      ${resolution.decisions.map(d => `
        <div class="card mb-16">
          <div class="card-header">
            <div class="card-title">📦 ${d.skuName}</div>
            <div class="text-sm text-rose font-600">Need ${d.requested} • Have ${d.available} • Shortage: ${d.shortage}</div>
          </div>
          <div class="card-body">
            <div class="decision-reasoning" style="margin-bottom:14px;">
              <h4>Decision Reasoning</h4>
              ${d.reasoning.map(r => `<div class="reasoning-item">${r}</div>`).join('')}
            </div>

            <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);margin-bottom:10px;">Options (ranked by score)</div>
            ${d.options.map((opt, i) => `
              <div class="alert-item ${opt.action === d.recommended.action ? 'info' : ''}" style="margin-bottom:8px;">
                <div style="font-size:20px;">${opt.icon}</div>
                <div style="flex:1;">
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                    <strong style="font-size:13px;">${opt.label}</strong>
                    ${i === 0 ? '<span class="badge badge-blue">⭐ Recommended</span>' : ''}
                    <span class="font-mono text-xs" style="color:var(--text-muted);">Score: ${opt.score}</span>
                  </div>
                  <div class="text-sm text-secondary">${opt.description}</div>
                  <div class="text-xs text-muted" style="margin-top:3px;">Impact: ${opt.impact}</div>
                </div>
                <button class="btn btn-xs btn-primary" onclick="APP.applyDecision('${resolution.orderId}', '${opt.action}'); UI.closeModal();">Apply</button>
              </div>`).join('')}
          </div>

      <div class="decision-card">
        <div class="decision-title">Overall Recommendation</div>
        <div class="decision-desc">${resolution.overallRecommendation}</div>
        <div class="decision-actions">
          <button class="btn btn-primary" onclick="APP.applyDecision('${resolution.orderId}', '${resolution.decisions[0].recommended.action}'); UI.closeModal();">
            ✓ Apply Recommended
          </button>
          <button class="btn btn-ghost" onclick="UI.closeModal()">Review Manually</button>
        </div>
      </div>
    `;
  }

  function createOrderModal() {
    const state = STATE.getState();
    return `
      <div class="form-group">
        <label class="form-label">Order Type</label>
        <select class="form-select" id="new-order-type">
          <option value="Standard">📦 Standard</option>
          <option value="Express">⚡ Express</option>
          <option value="VIP">👑 VIP</option>
          <option value="Bulk">🏭 Bulk</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Customer</label>
        <select class="form-select" id="new-order-customer">
          ${state.customers.sort((a,b)=>a.name.localeCompare(b.name)).map(c => `<option value="${c.id}">${c.name} (${c.tier})</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Product</label>
        <select class="form-select" id="new-order-sku">
          ${state.products.map(p => `<option value="${p.id}">${p.name} — ${p.id} (Stock: ${p.currentStock})</option>`).join('')}

      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Quantity</label>

        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <input type="text" class="form-input" id="new-order-notes" placeholder="Optional notes...">
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
        <button class="btn btn-ghost" onclick="UI.closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="APP.submitNewOrder()">Create Order</button>
      </div>

  function adjustStockModal(skuId) {
    const state = STATE.getState();
    const preSelected = skuId || state.products[0]?.id;
    return `
      <div class="form-group">
        <label class="form-label">Product</label>
        <select class="form-select" id="adj-sku">
          ${state.products.map(p => `<option value="${p.id}" ${p.id === preSelected ? 'selected' : ''}>${p.name} (${p.id}) — Current: ${p.currentStock}</option>`).join('')}
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Adjustment (+/-)</label>
          <input type="number" class="form-input" id="adj-delta" value="0" placeholder="e.g. +50 or -10">

        <div class="form-group">
          <label class="form-label">Reason</label>
          <select class="form-select" id="adj-reason">
            <option>Restock received</option>
            <option>Physical count correction</option>
            <option>Damaged item removal</option>

        <button class="btn btn-ghost" onclick="UI.closeModal()">Cancel</button>

  function reorderModal(products) {
    return `
      <div style="margin-bottom:16px;" class="text-secondary text-sm">
        ${products.length} SKUs need reordering. Estimated total procurement cost: ${formatINR(products.reduce((s,p)=>s+p.estimatedCost,0))}.
      </div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>SKU</th><th>Product</th><th>Urgency</th><th>Current</th><th>Reorder Qty</th><th>Supplier</th><th>ETA</th></tr></thead>
          <tbody>
            ${products.map(p => `
              <tr>
                <td class="font-mono text-xs">${p.product.id}</td>
                <td class="text-sm font-600">${p.product.name}</td>
                <td>${severityBadge(p.urgency.toLowerCase())}</td>
                <td class="font-mono">${p.product.currentStock}</td>
                <td class="font-mono font-600">${p.reorderQty}</td>

              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
        <button class="btn btn-ghost" onclick="UI.closeModal()">Cancel</button>

      </div>
    `;

  // ─── Page: Returns Management ────────────────────────────────────
  function renderReturns() {
    const state = STATE.getState();
    const returns = state.returns || [];

    const totalUnits  = returns.reduce((s,r) => s + r.qty, 0);
    const totalAmt    = returns.reduce((s,r) => s + r.refundAmt, 0);
    const pending     = returns.filter(r => r.status === 'pending').length;
    const inspecting  = returns.filter(r => r.status === 'inspecting').length;
    const restocked   = returns.filter(r => r.status === 'restocked').length;
    const disposed    = returns.filter(r => r.status === 'disposed').length;
    const refunded    = returns.filter(r => r.status === 'refunded').length;

    const condColor = {
      'Resaleable':       '#10b981',
      'Sealed / Unopened':'#3b82f6',
      'Partially Used':   '#f59e0b',
      'Damaged':          '#f43f5e',
    };

    return `
      <div class="page-header">
        <div class="page-header-left">
          <h2>↩ Returned Items Management</h2>
          <p>${returns.length} total return cases • ${totalUnits} units returned • ${pending + inspecting} awaiting action • Total refund value: ${formatINR(totalAmt)}</p>
        </div>
      </div>

      <!-- What is a Return? Explainer -->
      <div style="padding:14px 18px;background:rgba(244,63,94,0.06);border:1px solid rgba(244,63,94,0.15);border-radius:var(--radius-md);margin-bottom:20px;display:flex;gap:14px;align-items:flex-start;">
        <div style="font-size:28px;flex-shrink:0;">↩</div>
        <div>
          <div style="font-weight:700;margin-bottom:4px;color:var(--rose-400);">What is a Return?</div>
          <div style="font-size:13px;color:var(--text-secondary);line-height:1.7;">
            When a customer is unhappy with their order (wrong item, damaged, changed their mind), they send the product back to the warehouse.
            The warehouse must: <strong>1.</strong> Receive & inspect the returned item →
            <strong>2.</strong> Decide its condition (resaleable / damaged) →
            <strong>3.</strong> Either restock it back on the shelf or dispose of it →
            <strong>4.</strong> Process a refund to the customer.
          </div>
        </div>
      </div>

      <!-- Return Status KPIs -->
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px;">
        ${[
          { label:'Waiting to be Reviewed', val: pending,   color:'var(--amber-400)', bg:'rgba(245,158,11,0.1)',  icon:'⏳', desc:'Just arrived, not yet inspected' },
          { label:'Being Inspected Now',    val: inspecting, color:'var(--blue-400)',  bg:'rgba(59,130,246,0.1)', icon:'🔍', desc:'Worker is checking item condition' },
          { label:'Put Back in Stock',      val: restocked,  color:'var(--green-400)', bg:'rgba(16,185,129,0.1)', icon:'✅', desc:'Good condition — back on shelf' },
          { label:'Thrown Away / Disposed', val: disposed,   color:'var(--rose-400)',  bg:'rgba(244,63,94,0.1)',  icon:'🗑️', desc:'Too damaged to sell again' },
          { label:'Refund Sent to Customer',val: refunded,   color:'#a78bfa',          bg:'rgba(139,92,246,0.1)', icon:'💜', desc:'Money returned to buyer' },
        ].map(k => `
          <div style="padding:16px;background:${k.bg};border-radius:var(--radius-md);border:1px solid ${k.color}30;">
            <div style="font-size:24px;margin-bottom:6px;">${k.icon}</div>
            <div style="font-size:28px;font-weight:900;color:${k.color};">${k.val}</div>
            <div style="font-size:11px;font-weight:700;color:${k.color};margin-top:2px;">${k.label}</div>
            <div style="font-size:10px;color:var(--text-muted);margin-top:4px;">${k.desc}</div>
          </div>`).join('')}
      </div>

      <!-- Returns Table -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">↩ All Return Cases — Detailed List</div>
          <span style="font-size:12px;color:var(--text-muted);">Every item returned by a customer, with reason, condition and what was done</span>
        </div>
        <div class="card-body-p0">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Return ID</th>
                  <th>Linked Order</th>
                  <th>Product Returned</th>
                  <th>Qty</th>
                  <th>Why Customer Returned</th>
                  <th>Item Condition<br><span style="font-size:9px;font-weight:400;">(when received back)</span></th>
                  <th>Refund Amount</th>
                  <th>Current Status</th>
                  <th>Date Received</th>
                </tr>
              </thead>
              <tbody>
                ${returns.map(r => `
                  <tr>
                    <td><span class="font-mono font-600" style="color:var(--rose-400);">${r.id}</span></td>
                    <td>
                      <span class="font-mono" style="font-size:12px;cursor:pointer;color:var(--blue-400);" onclick="APP.navigate('orders')">${r.orderId}</span>
                    </td>
                    <td>
                      <div style="font-weight:600;font-size:13px;">${r.skuName}</div>
                      <div style="font-size:10px;color:var(--text-muted);font-family:monospace;">${r.skuId}</div>
                    </td>
                    <td><span style="font-size:16px;font-weight:800;">${r.qty}</span></td>
                    <td>
                      <div style="font-size:12px;max-width:180px;">${r.reason}</div>
                    </td>
                    <td>
                      <span style="font-size:11px;padding:3px 8px;border-radius:4px;font-weight:700;background:${condColor[r.condition]||'#64748b'}20;color:${condColor[r.condition]||'#64748b'};">${r.condition}</span>
                    </td>
                    <td>
                      <div style="font-size:14px;font-weight:800;color:var(--rose-400);font-family:'JetBrains Mono',monospace;">${formatINR(r.refundAmt)}</div>
                      <div style="font-size:10px;color:var(--text-muted);">${r.qty} × ${formatINR(r.unitPrice)}</div>
                    </td>
                    <td>${statusBadge(r.status)}</td>
                    <td style="font-size:12px;color:var(--text-muted);">${formatTimeAgo(r.createdAt)}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Summary Stats -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;">
        <div class="card">
          <div class="card-header"><div class="card-title">📊 Return Reasons Breakdown</div></div>
          <div class="card-body">
            ${Object.entries(
              returns.reduce((acc, r) => { acc[r.reason] = (acc[r.reason]||0) + 1; return acc; }, {})
            ).sort((a,b) => b[1]-a[1]).map(([reason, count]) => `
              <div class="stat-row" style="margin-bottom:8px;">
                <div style="flex:1;font-size:12px;color:var(--text-secondary);">${reason}</div>
                <div style="margin:0 12px;flex:1;">
                  <div class="progress-bar rose" style="height:5px;">
                    <div class="progress-fill" style="width:${(count/returns.length*100).toFixed(0)}%"></div>
                  </div>
                </div>
                <div style="font-size:12px;font-weight:700;width:24px;text-align:right;">${count}</div>
              </div>`).join('')}
          </div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">📦 Returned Item Conditions</div></div>
          <div class="card-body">
            ${['Resaleable','Sealed / Unopened','Partially Used','Damaged'].map(cond => {
              const cnt = returns.filter(r => r.condition === cond).length;
              const pct = returns.length ? (cnt/returns.length*100).toFixed(0) : 0;
              return `
              <div style="margin-bottom:14px;">
                <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                  <span style="font-size:12px;font-weight:600;color:${condColor[cond]||'var(--text-secondary)'};">${cond}</span>
                  <span style="font-size:12px;font-weight:700;">${cnt} items (${pct}%)</span>
                </div>
                <div class="progress-bar" style="height:8px;">
                  <div class="progress-fill" style="width:${pct}%;background:${condColor[cond]||'#64748b'};"></div>
                </div>
                <div style="font-size:10px;color:var(--text-muted);margin-top:3px;">
                  ${cond==='Resaleable'?'Can be put back on shelf and sold again':cond==='Sealed / Unopened'?'Unopened — can be restocked immediately':cond==='Partially Used'?'Used but might be resold at discount':' Cannot be resold — will be disposed'}
                </div>
              </div>`;
            }).join('')}
            <div style="padding:12px;background:rgba(16,185,129,0.08);border-radius:var(--radius-md);border:1px solid rgba(16,185,129,0.15);margin-top:8px;">
              <div style="font-size:12px;font-weight:700;color:var(--green-400);">✅ Recovery Rate</div>
              <div style="font-size:22px;font-weight:900;color:var(--green-400);">
                ${returns.length ? Math.round(returns.filter(r=>r.condition==='Resaleable'||r.condition==='Sealed / Unopened').length/returns.length*100) : 0}%
              </div>
              <div style="font-size:11px;color:var(--text-muted);">of returned items can be sold again</div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  return {
    toast,
    openModal,
    closeModal,
    formatINR,
    formatTimeAgo,
    formatDateTime,
    formatHours,
    statusBadge,
    priorityBadge,
    severityBadge,
    scoreBar,
    renderDashboard,
    renderInventory,
    renderOrders,
    renderPicking,
    renderExceptions,
    renderDispatch,
    renderAnalytics,
    renderAlerts,
    renderReturns,
    renderActivityItem,
    renderAlertItem,
    renderExceptionCard,
    orderDetailModal,
    conflictResolutionModal,
    createOrderModal,
    adjustStockModal,
    reorderModal,
    renderSelectedOrderPanel,
  };
})();


/* ═══ app.js ════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════
   APP.JS — Main Application Controller & Router
   WareSmart Warehouse Operations Platform
═══════════════════════════════════════════════════════════════════ */

const APP = (() => {

  // ─── Page registry ───────────────────────────────────────────────
  const PAGES = {
    dashboard:  { title: '🏭 Warehouse Overview',        subtitle: 'Live summary of all orders, stock levels, alerts and team activity happening right now',     render: () => UI.renderDashboard() },
    inventory:  { title: '📦 Stock & Inventory',          subtitle: 'See what products are in stock, where they are stored, and which items need to be reordered',   render: () => UI.renderInventory() },
    orders:     { title: '🛒 Customer Orders',           subtitle: 'All incoming orders sorted by urgency — click any row to see full order details & price breakdown', render: () => UI.renderOrders() },
    picking:    { title: '👷 Pick & Pack (Fulfillment)',  subtitle: 'Workers go to the warehouse shelf, pick the item, and pack it into a box ready for shipping',     render: () => UI.renderPicking() },
    exceptions: { title: '⚠️ Problems & Issues',          subtitle: 'Any problems found during fulfillment — damaged goods, missing items, wrong products sent out',    render: () => UI.renderExceptions() },
    dispatch:   { title: '🚚 Shipping & Dispatch',        subtitle: 'Orders that passed quality check and are ready to be handed over to the delivery partner',       render: () => UI.renderDispatch() },
    returns:    { title: '↩ Returned Items',             subtitle: 'Items sent back by customers — inspect condition, restock or dispose, and process refunds',          render: () => UI.renderReturns() },
    analytics:  { title: '📊 Reports & Performance',    subtitle: 'Charts and numbers showing how well the warehouse is performing over time',                       render: () => UI.renderAnalytics() },
    alerts:     { title: '🔔 Urgent Notifications',       subtitle: 'Critical warnings that need immediate attention — stockouts, delayed orders, system issues',    render: () => UI.renderAlerts() },
  };

  let _currentPage = 'dashboard';
  let _simInterval = null;
  let _clockInterval = null;

  // ─── Init ─────────────────────────────────────────────────────────
  function init() {
    STATE.init();
    buildSidebar();
    startClock();
    startSimulation();
    bindEvents();
    navigate('dashboard');
  }

  // ─── Sidebar Builder ─────────────────────────────────────────────
  function buildSidebar() {
    const nav = [
      { id: 'dashboard',  icon: '🏭', label: 'Dashboard',           badge: null },
      { id: 'orders',     icon: '🛒', label: 'Customer Orders',      badge: null },
      { id: 'inventory',  icon: '📦', label: 'Stock & Inventory',    badge: null },
      { id: 'picking',    icon: '👷', label: 'Pick & Pack',          badge: null },
      { id: 'exceptions', icon: '⚠️', label: 'Issues / Problems',    badge: null },
      { id: 'dispatch',   icon: '🚚', label: 'Shipping',             badge: null },
      { id: 'returns',    icon: '↩',  label: 'Returned Items',       badge: null },
      { id: 'analytics',  icon: '📊', label: 'Reports',              badge: null },
      { id: 'alerts',     icon: '🔔', label: 'Alerts',               badge: null },
    ];

    const navItems = document.getElementById('nav-items');
    if (!navItems) return;

    navItems.innerHTML = nav.map(item => `
      <div class="nav-item ${item.id === _currentPage ? 'active' : ''}" id="nav-${item.id}" onclick="APP.navigate('${item.id}')">
        <span class="nav-icon">${item.icon}</span>
        <span class="nav-label">${item.label}</span>
        ${item.badge ? `<span class="nav-badge" id="badge-${item.id}">${item.badge}</span>` : `<span class="nav-badge" id="badge-${item.id}" style="display:none;">0</span>`}
      </div>
    `).join('');

    updateNavBadges();
  }

  function updateNavBadges() {
    const state = STATE.getState();
    const badges = {
      orders:     state.orders.filter(o => o.isConflict && o.status !== 'dispatched').length || null,
      exceptions: state.exceptions.filter(e => e.status !== 'resolved').length || null,
      alerts:     state.alerts.filter(a => a.severity === 'critical').length || null,
      picking:    state.orders.filter(o => o.status === 'picking').length || null,
    };

    Object.entries(badges).forEach(([id, val]) => {
      const badge = document.getElementById(`badge-${id}`);
      if (badge) {
        if (val && val > 0) {
          badge.textContent = val;
          badge.style.display = '';
        } else {
          badge.style.display = 'none';
        }
      }
    });
  }

  // ─── Navigation ───────────────────────────────────────────────────
  function navigate(pageId, options = {}) {
    if (!PAGES[pageId]) return;

    _currentPage = pageId;

    // Update nav active state
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    const navEl = document.getElementById(`nav-${pageId}`);
    if (navEl) navEl.classList.add('active');

    // Update topbar
    const page = PAGES[pageId];
    const titleEl = document.getElementById('topbar-title');
    const subtitleEl = document.getElementById('topbar-subtitle');
    if (titleEl) titleEl.textContent = page.title;
    if (subtitleEl) subtitleEl.textContent = page.subtitle;

    // Render content
    const content = document.getElementById('content');
    if (content) {
      content.style.animation = 'none';
      content.innerHTML = page.render();
      content.style.animation = 'fadeIn 0.3s ease';
    }

    // Draw charts after render
    setTimeout(() => drawChartsForPage(pageId), 50);
  }

  // ─── Chart drawing per page ───────────────────────────────────────
  function drawChartsForPage(pageId) {
    const state = STATE.getState();
    const hourlyData = DATA.hourlyData;

    if (pageId === 'dashboard') {
      // Throughput chart
      ANALYTICS.drawLineChart('throughput-chart', [
        { data: hourlyData.map(h => h.orders), color: '#3b82f6', fill: true },
        { data: hourlyData.map(h => h.dispatched), color: '#10b981', fill: true },
        { data: hourlyData.map(h => Math.floor(h.picks / 3)), color: '#f59e0b', fill: false },
      ], hourlyData.map(h => {
        const d = new Date(h.hour);
        return d.getHours() + 'h';
      }), { height: 180 });

      // Status donut
      const statuses = ['created', 'allocated', 'picking', 'packing', 'qc', 'dispatched'];
      const statusColors = ['#94a3b8', '#06b6d4', '#f59e0b', '#8b5cf6', '#3b82f6', '#10b981'];
      const statusCounts = statuses.map(s => state.orders.filter(o => o.status === s).length);
      const total = statusCounts.reduce((a, b) => a + b, 0);
      ANALYTICS.drawDonutChart('status-donut', statuses, statusCounts, statusColors, {
        size: 140, centerLabel: total, centerSub: 'orders',
      });
    }

    if (pageId === 'analytics') {
      const { catMap, typeMap, tierRev } = ANALYTICS.computeAnalytics();

      // Throughput
      ANALYTICS.drawLineChart('analytics-throughput', [
        { data: hourlyData.map(h => h.orders), color: '#3b82f6', fill: true },
        { data: hourlyData.map(h => h.dispatched), color: '#10b981', fill: true },
      ], hourlyData.map(h => new Date(h.hour).getHours() + 'h'), { height: 200 });

      // Category bar
      const catLabels = Object.keys(catMap);
      const catValues = catLabels.map(c => Math.round(catMap[c].value / 100000));
      ANALYTICS.drawBarChart('cat-bar-chart', catLabels, catValues,
        ['#3b82f6', '#10b981', '#f59e0b', '#f43f5e', '#8b5cf6', '#06b6d4', '#f59e0b', '#94a3b8'],
        { height: 200, formatY: v => '₹' + v + 'L', showValues: true }
      );

      // Type donut
      const typeLabels = Object.keys(typeMap);
      const typeColors = { VIP: '#f43f5e', Express: '#f59e0b', Standard: '#3b82f6', Bulk: '#8b5cf6' };
      ANALYTICS.drawDonutChart('type-donut',
        typeLabels, typeLabels.map(t => typeMap[t]),
        typeLabels.map(t => typeColors[t]),
        { size: 160, centerLabel: Object.values(typeMap).reduce((a,b)=>a+b,0), centerSub: 'orders' }
      );

      // Tier donut
      const tierLabels = Object.keys(tierRev);
      ANALYTICS.drawDonutChart('tier-donut',
        tierLabels, tierLabels.map(t => tierRev[t]),
        ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b'],
        { size: 120, centerLabel: '₹', centerSub: 'revenue' }
      );

      // Zone gauges
      Object.values(state.zoneMetrics).forEach(z => {
        const color = z.utilization > 80 ? '#f43f5e' : z.utilization > 60 ? '#f59e0b' : '#10b981';
        ANALYTICS.drawGauge(`gauge-${z.zone}`, z.utilization, 100, color, { size: 100 });
      });
    }

    if (pageId === 'dispatch') {
      // Carrier bar chart
      const carriers = {};
      state.orders.filter(o => o.status === 'dispatched').forEach(o => {
        carriers[o.carrier] = (carriers[o.carrier] || 0) + 1;
      });
      const cLabels = Object.keys(carriers);
      const cValues = cLabels.map(c => carriers[c]);
      ANALYTICS.drawBarChart('carrier-chart', cLabels, cValues,
        ['#3b82f6', '#10b981', '#f59e0b', '#f43f5e', '#8b5cf6', '#06b6d4'],
        { height: 160 }
      );
    }
  }

  function submitNewOrder() {
    const type = document.getElementById('new-order-type')?.value;
    const customerId = document.getElementById('new-order-customer')?.value;
    const skuId = document.getElementById('new-order-sku')?.value;
    const qty = parseInt(document.getElementById('new-order-qty')?.value || '1');
    const notes = document.getElementById('new-order-notes')?.value || '';

    if (!type || !skuId || qty < 1) {
      UI.toast('Invalid Input', 'Please fill all required fields.', 'error');
      return;
    }

    const customer = STATE.getState().customers.find(c => c.id === customerId);
    const product = STATE.getProduct(skuId);
    if (!customer || !product) return;

    const order = STATE.createOrder({
      type,
      customer,
      items: [{ skuId: product.id, skuName: product.name, qty, unitPrice: product.unitPrice, zone: product.zone, bin: product.bin }],
      notes,
    });

    UI.closeModal();
    UI.toast('Order Created! 🎉', `${order.id} — ${type} order for ${customer.name}`, 'success');

    if (order.isConflict) {
      setTimeout(() => {
        UI.toast('⚠ Stock Conflict Detected', `Insufficient stock for ${product.name}. Conflict resolution recommended.`, 'warning', 6000);
      }, 1000);
    }

    navigate('orders');
  }

  // ─── Order Row Selection ──────────────────────────────────────────
  function selectOrder(orderId) {
    // Deselect previous
    if (_selectedOrderId) {
      const prevRow = document.getElementById(`ord-row-${_selectedOrderId}`);
      if (prevRow) prevRow.style.background = '';
      const prevCheck = document.getElementById(`ord-check-${_selectedOrderId}`);
      if (prevCheck) {
        prevCheck.style.background = '';
        prevCheck.style.borderColor = 'var(--border-default)';
        prevCheck.innerHTML = '';
      }
    }

    // If clicking same order again — deselect
    if (_selectedOrderId === orderId) {
      _selectedOrderId = null;
      _hideSplitPanel();
      return;
    }

    _selectedOrderId = orderId;

    // Highlight selected row
    const row = document.getElementById(`ord-row-${orderId}`);
    if (row) {
      row.style.background = 'linear-gradient(90deg, rgba(59,130,246,0.10), rgba(59,130,246,0.04))';
      row.style.boxShadow = 'inset 3px 0 0 var(--blue-500)';
    }

    // Check dot
    const check = document.getElementById(`ord-check-${orderId}`);
    if (check) {
      check.style.background = 'var(--blue-500)';
      check.style.borderColor = 'var(--blue-400)';
      check.innerHTML = '✓';
      check.style.color = '#fff';
      check.style.fontSize = '10px';
      check.style.fontWeight = '700';
    }

    // Show split panel
    _showSplitPanel(orderId);
  }

  function deselectOrder() {
    if (_selectedOrderId) {
      const row = document.getElementById(`ord-row-${_selectedOrderId}`);
      if (row) { row.style.background = ''; row.style.boxShadow = ''; }
      const check = document.getElementById(`ord-check-${_selectedOrderId}`);
      if (check) {
        check.style.background = '';
        check.style.borderColor = 'var(--border-default)';
        check.innerHTML = '';
      }
    }
    _selectedOrderId = null;
    _hideSplitPanel();
  }

  function _showSplitPanel(orderId) {
    const split = document.getElementById('orders-split');
    const panel = document.getElementById('selected-order-panel');
    if (!split || !panel) return;

    panel.style.display = 'block';
    panel.innerHTML = UI.renderSelectedOrderPanel(orderId);
    split.style.gridTemplateColumns = '1fr 360px';
    split.style.alignItems = 'start';

    const split = document.getElementById('orders-split');

    UI.toast('Workers Assigned ✓', 'Auto-assigned workers to all active pick lists.', 'success');
  }

  // ─── Dispatch Actions ─────────────────────────────────────────────
  function batchDispatch() {
    const state = STATE.getState();
    const qcOrders = state.orders.filter(o => o.status === 'qc');
    qcOrders.forEach(o => STATE.advanceOrderStatus(o.id));
    UI.toast(`Batch Dispatched 🚀`, `${qcOrders.length} orders dispatched.`, 'success');
    navigate('dispatch');
  }

  // ─── Alert Actions ────────────────────────────────────────────────
  function handleAlertAction(alertId, type, refId) {
    if (type === 'stockout' || type === 'low-stock') {
      quickReorder(refId);
    } else if (type === 'sla' || type === 'sla-breach') {
      showOrderDetail(refId);
    }
  }

  function dismissAllAlerts() {
    STATE.getState().alerts = [];
    UI.toast('All Alerts Dismissed', 'Alert center cleared.', 'info');
    navigate('alerts');
  }

  return {
    init,
    navigate,
    // Orders
    advanceOrder,
    cancelOrder,
    showOrderDetail,
    showConflictResolution,
    applyDecision,
    showCreateOrderModal,
    submitNewOrder,
    filterOrders,
    showBulkActionModal,
    bulkAllocate,
    bulkPickList,
    // Orders
    filterOrders,
    selectOrder,
    deselectOrder,
    // Inventory
    filterInventory,
    filterInventoryZone,
    showAdjustStockModal,
    submitStockAdjust,
    showReorderModal,
    quickReorder,
    showProductDetail,
    submitReorderAll,
    // Exceptions
    showCreateExceptionModal,
    submitException,
    resolveException,
    showResolveExceptionModal,
    escalateException,
    switchExcTab,
    // Picking
    scanPickItem,
    completePickList,
    reportPickException,
    submitPickException,
    generatePickLists,
    assignWorkers,
    // Dispatch
    batchDispatch,
    // Alerts
    handleAlertAction,
    dismissAllAlerts,
    // Returns
    showReturnsForOrder,
  };
})();

  function showReturnsForOrder(orderId) {
    const state = STATE.getState();
    const rets = (state.returns || []).filter(r => r.orderId === orderId);
    if (rets.length === 0) {
      UI.toast('No Returns', 'No returns recorded for ' + orderId + '.', 'info');
      return;
    }
    const condColor = { 'Resaleable':'var(--green-400)', 'Sealed / Unopened':'var(--blue-400)', 'Partially Used':'var(--amber-400)', 'Damaged':'var(--rose-400)' };
    const stClr    = { pending:'var(--amber-400)', inspecting:'var(--blue-400)', restocked:'var(--green-400)', disposed:'var(--rose-400)', refunded:'#a78bfa' };
    const totalQty = rets.reduce((s,r)=>s+r.qty,0);
    const totalAmt = rets.reduce((s,r)=>s+r.refundAmt,0);
    const rows = rets.map(r => `
      <div style="padding:12px;background:var(--bg-overlay);border-radius:var(--radius-md);border:1px solid rgba(244,63,94,0.15);margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
          <div><div style="font-size:13px;font-weight:700;">${r.skuName}</div><div style="font-size:11px;color:var(--text-muted);font-family:monospace;">${r.id} • ${r.skuId}</div></div>
          <div style="text-align:right;"><div style="font-size:14px;font-weight:800;color:var(--rose-400);">${UI.formatINR(r.refundAmt)}</div><div style="font-size:11px;color:var(--text-muted);">${r.qty} unit${r.qty>1?'s':''} x ${UI.formatINR(r.unitPrice)}</div></div>
        </div>
        <div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;">📋 ${r.reason}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <span style="font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;background:rgba(244,63,94,0.1);color:${condColor[r.condition]||'var(--text-secondary)'}">${r.condition}</span>
          <span style="font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;background:var(--bg-elevated);color:${stClr[r.status]||'var(--text-secondary)'}">${r.status.toUpperCase()}</span>
          <span style="font-size:10px;color:var(--text-muted);">Received: ${UI.formatTimeAgo(r.createdAt)}</span>
        </div>
      </div>`).join('');
    UI.openModal(
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">'
      + '<div style="flex:1;min-width:120px;padding:12px;background:rgba(244,63,94,0.08);border-radius:8px;text-align:center;"><div style="font-size:24px;font-weight:900;color:var(--rose-400);">' + totalQty + '</div><div style="font-size:11px;color:var(--text-muted);">Units Returned</div></div>'
      + '<div style="flex:1;min-width:120px;padding:12px;background:rgba(244,63,94,0.05);border-radius:8px;text-align:center;"><div style="font-size:20px;font-weight:900;color:var(--rose-400);font-family:monospace;">' + UI.formatINR(totalAmt) + '</div><div style="font-size:11px;color:var(--text-muted);">Total Refunded</div></div>'
      + '</div>' + rows
      + '<div style="margin-top:14px;"><button class="btn btn-ghost" onclick="UI.closeModal()">Close</button></div>',
      '\u21a9 Returns for ' + orderId, 'modal-lg'
    );
  }

// ─── Bootstrap ───────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  APP.init();
});

  </script>
</body>
</html>
