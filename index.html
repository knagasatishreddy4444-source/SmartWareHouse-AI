  <style>
/* ═══════════════════════════════════════════════════════════════════
   WARESMART — DESIGN SYSTEM
   Premium Dark Mode Warehouse Operations Platform
═══════════════════════════════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

/* ─── CSS Custom Properties ─────────────────────────────────────── */
:root {
  /* Base Colors */
  --bg-base:        #070b14;
  --bg-surface:     #0d1117;
  --bg-elevated:    #161b27;
  --bg-overlay:     #1e2535;
  --bg-hover:       #252d3d;

  /* Border */
  --border-subtle:  rgba(255,255,255,0.06);
  --border-default: rgba(255,255,255,0.10);
  --border-strong:  rgba(255,255,255,0.18);

  /* Brand Blues */
  --blue-400: #60a5fa;
  --blue-500: #3b82f6;
  --blue-600: #2563eb;
  --blue-glow: rgba(59,130,246,0.25);

  /* Emerald */
  --green-400: #34d399;
  --green-500: #10b981;
  --green-600: #059669;
  --green-glow: rgba(16,185,129,0.2);

  /* Amber */
  --amber-400: #fbbf24;
  --amber-500: #f59e0b;
  --amber-600: #d97706;
  --amber-glow: rgba(245,158,11,0.2);

  /* Rose */
  --rose-400: #fb7185;
  --rose-500: #f43f5e;
  --rose-600: #e11d48;
  --rose-glow: rgba(244,63,94,0.2);

  /* Violet */
  --violet-400: #a78bfa;
  --violet-500: #8b5cf6;
  --violet-glow: rgba(139,92,246,0.2);

  /* Cyan */
  --cyan-400: #22d3ee;
  --cyan-500: #06b6d4;
  --cyan-glow: rgba(6,182,212,0.2);

  /* Text */
  --text-primary:   #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted:     #4b5563;
  --text-disabled:  #374151;

  /* Sidebar */
  --sidebar-w: 260px;
  --sidebar-collapsed-w: 72px;

  /* Transitions */
  --transition-fast: 0.15s ease;
  --transition-med:  0.25s ease;
  --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);

  /* Shadows */
  --shadow-sm:   0 1px 3px rgba(0,0,0,0.4);
  --shadow-md:   0 4px 16px rgba(0,0,0,0.5);
  --shadow-lg:   0 8px 32px rgba(0,0,0,0.6);
  --shadow-xl:   0 20px 60px rgba(0,0,0,0.7);
  --shadow-blue: 0 0 20px rgba(59,130,246,0.3);
  --shadow-green:0 0 20px rgba(16,185,129,0.3);

  /* Border radius */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-full: 9999px;
}

/* ─── Reset & Base ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 14px; scroll-behavior: smooth; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-overlay); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--bg-hover); }

/* ─── App Shell ──────────────────────────────────────────────────── */
#app {
  display: flex;
  min-height: 100vh;
}

/* ─── Sidebar ────────────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0; top: 0; bottom: 0;
  z-index: 100;
  transition: width var(--transition-slow);
  overflow: hidden;
}

#sidebar.collapsed { width: var(--sidebar-collapsed-w); }

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 18px;
  border-bottom: 1px solid var(--border-subtle);
  min-height: 72px;
}

.logo-icon {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--blue-500), var(--violet-500));
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 18px;
  box-shadow: var(--shadow-blue);
}

.logo-text {
  white-space: nowrap;
  overflow: hidden;
  transition: opacity var(--transition-med), width var(--transition-med);
}

.logo-text h1 {
  font-size: 16px;
  font-weight: 800;
  background: linear-gradient(135deg, #fff 0%, var(--blue-400) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.3px;
}

.logo-text p {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-top: 1px;
}

#sidebar.collapsed .logo-text { opacity: 0; width: 0; }

.sidebar-section-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 18px 20px 8px;
  white-space: nowrap;
  overflow: hidden;
  transition: opacity var(--transition-med);
}

#sidebar.collapsed .sidebar-section-label { opacity: 0; }

.nav-items { flex: 1; padding: 8px 10px; overflow-y: auto; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 10px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
  position: relative;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  user-select: none;
  border: 1px solid transparent;
}

.nav-item:hover {
  background: var(--bg-elevated);
  border-color: var(--border-subtle);
}

.nav-item.active {
  background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(139,92,246,0.08));
  border-color: rgba(59,130,246,0.3);
}

.nav-item.active .nav-icon { color: var(--blue-400); }
.nav-item.active .nav-label { color: var(--text-primary); font-weight: 600; }

.nav-icon {
  font-size: 18px;
  width: 22px;
  text-align: center;
  color: var(--text-secondary);
  flex-shrink: 0;
  transition: color var(--transition-fast);
}

.nav-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: color var(--transition-fast);
}

.nav-badge {
  margin-left: auto;
  background: var(--rose-500);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: var(--radius-full);
  min-width: 18px;
  text-align: center;
  flex-shrink: 0;
  animation: pulse-badge 2s infinite;
}

@keyframes pulse-badge {
  0%, 100% { box-shadow: 0 0 0 0 rgba(244,63,94,0.4); }
  50% { box-shadow: 0 0 0 4px rgba(244,63,94,0); }
}

.sidebar-footer {
  padding: 14px 10px;
  border-top: 1px solid var(--border-subtle);
}

.sim-status {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px;
  background: var(--bg-elevated);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
}

.sim-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green-400);
  flex-shrink: 0;
  animation: pulse-green 2s infinite;
}

@keyframes pulse-green {
  0%, 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.5); }
  50% { box-shadow: 0 0 0 6px rgba(52,211,153,0); }
}

.sim-info { overflow: hidden; }
.sim-info span { font-size: 11px; font-weight: 600; color: var(--green-400); display: block; white-space: nowrap; }
.sim-info small { font-size: 9px; color: var(--text-muted); }
#sidebar.collapsed .sim-info { display: none; }

.collapse-btn {
  width: 100%;
  padding: 8px;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
  transition: all var(--transition-fast);
  margin-top: 8px;
  font-size: 16px;
}
.collapse-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }

/* ─── Main Content ───────────────────────────────────────────────── */
#main {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  transition: margin-left var(--transition-slow);
}

#sidebar.collapsed ~ #main { margin-left: var(--sidebar-collapsed-w); }

/* ─── Topbar ─────────────────────────────────────────────────────── */
#topbar {
  height: 72px;
  background: rgba(13,17,23,0.8);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 90;
}

.topbar-title {
  flex: 1;
}

.topbar-title h2 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
}

.topbar-title p {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 1px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.topbar-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-elevated);
  padding: 6px 14px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  letter-spacing: 0.5px;
}

.btn-icon {
  width: 38px; height: 38px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 16px;
  color: var(--text-secondary);
  transition: all var(--transition-fast);
  position: relative;
}

.btn-icon:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  border-color: var(--border-default);
}

.btn-icon .notif-dot {
  position: absolute;
  top: 6px; right: 6px;
  width: 7px; height: 7px;
  background: var(--rose-500);
  border-radius: 50%;
  border: 1.5px solid var(--bg-surface);
}

/* ─── Content Area ───────────────────────────────────────────────── */
#content {
  flex: 1;
  padding: 28px;
  overflow-y: auto;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ─── Page Headers ───────────────────────────────────────────────── */
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 12px;
}

.page-header-left h2 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.page-header-left p {
  color: var(--text-secondary);
  font-size: 13px;
  margin-top: 4px;
}

.page-header-right {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

/* ─── Buttons ────────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-md);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all var(--transition-fast);
  white-space: nowrap;
  text-decoration: none;
}

.btn-primary {
  background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
  color: #fff;
  border-color: var(--blue-600);
  box-shadow: 0 2px 8px rgba(59,130,246,0.3);
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--blue-400), var(--blue-500));
  box-shadow: 0 4px 16px rgba(59,130,246,0.4);
  transform: translateY(-1px);
}

.btn-success {
  background: linear-gradient(135deg, var(--green-500), var(--green-600));
  color: #fff;
  border-color: var(--green-600);
  box-shadow: 0 2px 8px rgba(16,185,129,0.3);
}
.btn-success:hover {
  background: linear-gradient(135deg, var(--green-400), var(--green-500));
  box-shadow: 0 4px 16px rgba(16,185,129,0.4);
  transform: translateY(-1px);
}

.btn-danger {
  background: linear-gradient(135deg, var(--rose-500), var(--rose-600));
  color: #fff;
  border-color: var(--rose-600);
}
.btn-danger:hover { background: linear-gradient(135deg, var(--rose-400), var(--rose-500)); transform: translateY(-1px); }

.btn-amber {
  background: linear-gradient(135deg, var(--amber-500), var(--amber-600));
  color: #fff;
  border-color: var(--amber-600);
}
.btn-amber:hover { transform: translateY(-1px); }

.btn-ghost {
  background: var(--bg-elevated);
  color: var(--text-secondary);
  border-color: var(--border-default);
}
.btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-strong); }

.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-xs { padding: 3px 8px; font-size: 11px; border-radius: var(--radius-sm); }
.btn-lg { padding: 11px 24px; font-size: 14px; }

/* ─── KPI Cards ──────────────────────────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: all var(--transition-med);
}

.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 2px;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}

.kpi-card.blue::before { background: linear-gradient(90deg, var(--blue-500), var(--blue-400)); }
.kpi-card.green::before { background: linear-gradient(90deg, var(--green-500), var(--green-400)); }
.kpi-card.amber::before { background: linear-gradient(90deg, var(--amber-500), var(--amber-400)); }
.kpi-card.rose::before { background: linear-gradient(90deg, var(--rose-500), var(--rose-400)); }
.kpi-card.violet::before { background: linear-gradient(90deg, var(--violet-500), var(--violet-400)); }
.kpi-card.cyan::before { background: linear-gradient(90deg, var(--cyan-500), var(--cyan-400)); }

.kpi-card:hover {
  background: var(--bg-overlay);
  border-color: var(--border-default);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.kpi-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
}

.kpi-icon {
  width: 40px; height: 40px;
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}

.kpi-card.blue .kpi-icon { background: rgba(59,130,246,0.12); }
.kpi-card.green .kpi-icon { background: rgba(16,185,129,0.12); }
.kpi-card.amber .kpi-icon { background: rgba(245,158,11,0.12); }
.kpi-card.rose .kpi-icon { background: rgba(244,63,94,0.12); }
.kpi-card.violet .kpi-icon { background: rgba(139,92,246,0.12); }
.kpi-card.cyan .kpi-icon { background: rgba(6,182,212,0.12); }

.kpi-trend {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 7px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  gap: 3px;
}
.kpi-trend.up { color: var(--green-400); background: rgba(16,185,129,0.1); }
.kpi-trend.down { color: var(--rose-400); background: rgba(244,63,94,0.1); }
.kpi-trend.neutral { color: var(--amber-400); background: rgba(245,158,11,0.1); }

.kpi-value {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -1px;
  line-height: 1;
  margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}

.kpi-label {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
}

.kpi-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border-subtle);
}

/* ─── Cards / Panels ─────────────────────────────────────────────── */
.card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-subtle);
}

.card-title {
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-body { padding: 20px; }
.card-body-p0 { padding: 0; }

/* ─── Grid Layouts ───────────────────────────────────────────────── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
.grid-12 { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
.grid-21 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.grid-13 { display: grid; grid-template-columns: 1fr 3fr; gap: 20px; }

@media (max-width: 1200px) {
  .grid-2, .grid-3, .grid-12, .grid-21, .grid-13 { grid-template-columns: 1fr; }
}

/* ─── Tables ─────────────────────────────────────────────────────── */
.table-wrapper {
  overflow-x: auto;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead tr {
  background: var(--bg-overlay);
  border-bottom: 1px solid var(--border-default);
}

thead th {
  padding: 11px 16px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.7px;
  white-space: nowrap;
  user-select: none;
  cursor: pointer;
}

thead th:hover { color: var(--text-primary); }

tbody tr {
  border-bottom: 1px solid var(--border-subtle);
  transition: background var(--transition-fast);
}

tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.02); }

tbody td {
  padding: 12px 16px;
  font-size: 13px;
  color: var(--text-primary);
  vertical-align: middle;
}

/* ─── Badges / Status Pills ──────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3px;
  white-space: nowrap;
}

.badge-blue    { background: rgba(59,130,246,0.15);  color: var(--blue-400);   border: 1px solid rgba(59,130,246,0.25); }
.badge-green   { background: rgba(16,185,129,0.15);  color: var(--green-400);  border: 1px solid rgba(16,185,129,0.25); }
.badge-amber   { background: rgba(245,158,11,0.15);  color: var(--amber-400);  border: 1px solid rgba(245,158,11,0.25); }
.badge-rose    { background: rgba(244,63,94,0.15);   color: var(--rose-400);   border: 1px solid rgba(244,63,94,0.25); }
.badge-violet  { background: rgba(139,92,246,0.15);  color: var(--violet-400); border: 1px solid rgba(139,92,246,0.25); }
.badge-cyan    { background: rgba(6,182,212,0.15);   color: var(--cyan-400);   border: 1px solid rgba(6,182,212,0.25); }
.badge-gray    { background: rgba(148,163,184,0.1);  color: var(--text-secondary); border: 1px solid var(--border-subtle); }

/* Order Status Badges */
.status-created    { background: rgba(148,163,184,0.1);  color: var(--text-secondary); border: 1px solid var(--border-subtle); }
.status-allocated  { background: rgba(6,182,212,0.15);   color: var(--cyan-400);       border: 1px solid rgba(6,182,212,0.25); }
.status-picking    { background: rgba(245,158,11,0.15);  color: var(--amber-400);      border: 1px solid rgba(245,158,11,0.25); }
.status-packing    { background: rgba(139,92,246,0.15);  color: var(--violet-400);     border: 1px solid rgba(139,92,246,0.25); }
.status-qc         { background: rgba(59,130,246,0.15);  color: var(--blue-400);       border: 1px solid rgba(59,130,246,0.25); }
.status-dispatched { background: rgba(16,185,129,0.15);  color: var(--green-400);      border: 1px solid rgba(16,185,129,0.25); }
.status-exception  { background: rgba(244,63,94,0.15);   color: var(--rose-400);       border: 1px solid rgba(244,63,94,0.25); }
.status-partial    { background: rgba(245,158,11,0.15);  color: var(--amber-400);      border: 1px solid rgba(245,158,11,0.25); }
.status-backorder  { background: rgba(244,63,94,0.1);    color: #ef4444;               border: 1px solid rgba(244,63,94,0.2); }

/* Priority Badges */
.priority-vip      { background: rgba(244,63,94,0.15);   color: var(--rose-400);   border: 1px solid rgba(244,63,94,0.3); }
.priority-express  { background: rgba(245,158,11,0.15);  color: var(--amber-400);  border: 1px solid rgba(245,158,11,0.3); }
.priority-standard { background: rgba(59,130,246,0.1);   color: var(--blue-400);   border: 1px solid rgba(59,130,246,0.2); }
.priority-bulk     { background: rgba(148,163,184,0.1);  color: var(--text-secondary); border: 1px solid var(--border-subtle); }

/* ─── Progress Bars ──────────────────────────────────────────────── */
.progress-bar {
  height: 6px;
  background: var(--bg-overlay);
  border-radius: var(--radius-full);
  overflow: hidden;
  position: relative;
}

.progress-fill {
  height: 100%;
  border-radius: var(--radius-full);
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.progress-bar.blue  .progress-fill { background: linear-gradient(90deg, var(--blue-500), var(--blue-400)); }
.progress-bar.green .progress-fill { background: linear-gradient(90deg, var(--green-500), var(--green-400)); }
.progress-bar.amber .progress-fill { background: linear-gradient(90deg, var(--amber-500), var(--amber-400)); }
.progress-bar.rose  .progress-fill { background: linear-gradient(90deg, var(--rose-500), var(--rose-400)); }

.progress-bar.animated .progress-fill {
  animation: shimmer 2s infinite;
  background-size: 200% 100%;
}

@keyframes shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position:  200% 0; }
}

/* Stock level bars */
.stock-gauge {
  display: flex;
  align-items: center;
  gap: 10px;
}

.stock-bar {
  flex: 1;
  height: 6px;
  background: var(--bg-overlay);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.stock-fill {
  height: 100%;
  border-radius: var(--radius-full);
  transition: width 0.5s ease;
}

.stock-fill.critical { background: var(--rose-500); }
.stock-fill.low      { background: var(--amber-500); }
.stock-fill.good     { background: var(--green-500); }
.stock-fill.high     { background: var(--blue-500); }

/* ─── Activity Feed ──────────────────────────────────────────────── */
.activity-feed {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.activity-item {
  display: flex;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border-subtle);
  animation: slideInLeft 0.3s ease;
}

@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-10px); }
  to   { opacity: 1; transform: translateX(0); }
}

.activity-item:last-child { border-bottom: none; }

.activity-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-top: 4px;
  flex-shrink: 0;
}

.activity-content { flex: 1; min-width: 0; }
.activity-content p { font-size: 12px; color: var(--text-primary); line-height: 1.5; }
.activity-time { font-size: 10px; color: var(--text-muted); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }

/* ─── Alert Cards ────────────────────────────────────────────────── */
.alert-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 1px solid;
  margin-bottom: 10px;
  transition: all var(--transition-fast);
}

.alert-item:hover { transform: translateX(3px); }

.alert-item.critical {
  background: rgba(244,63,94,0.05);
  border-color: rgba(244,63,94,0.25);
}
.alert-item.warning {
  background: rgba(245,158,11,0.05);
  border-color: rgba(245,158,11,0.25);
}
.alert-item.info {
  background: rgba(59,130,246,0.05);
  border-color: rgba(59,130,246,0.2);
}

.alert-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.alert-body { flex: 1; min-width: 0; }
.alert-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.alert-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
.alert-actions { display: flex; gap: 6px; margin-top: 8px; }
.alert-time { font-size: 10px; color: var(--text-muted); flex-shrink: 0; font-family: 'JetBrains Mono', monospace; }

/* ─── Decision Cards ─────────────────────────────────────────────── */
.decision-card {
  background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(139,92,246,0.05));
  border: 1px solid rgba(59,130,246,0.25);
  border-radius: var(--radius-lg);
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.decision-card::before {
  content: '🧠 AI DECISION';
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: var(--blue-400);
  position: absolute;
  top: 14px; right: 14px;
  background: rgba(59,130,246,0.12);
  padding: 3px 8px;
  border-radius: var(--radius-full);
  border: 1px solid rgba(59,130,246,0.2);
}

.decision-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 8px;
  padding-right: 100px;
}

.decision-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 14px;
}

.decision-reasoning {
  background: var(--bg-surface);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: 14px;
  border: 1px solid var(--border-subtle);
}

.decision-reasoning h4 {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.reasoning-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 12px;
  color: var(--text-secondary);
}

.reasoning-item::before { content: '→'; color: var(--blue-400); flex-shrink: 0; font-weight: 700; }

.decision-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ─── Charts ─────────────────────────────────────────────────────── */
.chart-container {
  position: relative;
  width: 100%;
}

.chart-container canvas {
  width: 100% !important;
  display: block;
}

.chart-legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-secondary);
}

.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ─── Zone Heatmap ───────────────────────────────────────────────── */
.zone-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.zone-cell {
  aspect-ratio: 1.2;
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  transition: all var(--transition-med);
  border: 1px solid transparent;
  position: relative;
  overflow: hidden;
}

.zone-cell:hover { transform: scale(1.04); }

.zone-cell .zone-label { font-size: 22px; font-weight: 900; }
.zone-cell .zone-name { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.8; }
.zone-cell .zone-stat { font-size: 11px; opacity: 0.7; }

/* ─── Search & Filters ───────────────────────────────────────────── */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.search-input {
  flex: 1;
  min-width: 200px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: 9px 14px 9px 38px;
  font-size: 13px;
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  transition: all var(--transition-fast);
  position: relative;
}

.search-wrapper {
  position: relative;
  flex: 1;
  min-width: 200px;
}

.search-wrapper::before {
  content: '🔍';
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  pointer-events: none;
}

.search-input:focus {
  outline: none;
  border-color: var(--blue-500);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}

.filter-select {
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: 9px 14px;
  font-size: 13px;
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.filter-select:focus {
  outline: none;
  border-color: var(--blue-500);
}

/* ─── Modal ──────────────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: backdropIn 0.2s ease;
}

@keyframes backdropIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.modal {
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 620px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-xl);
  animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-lg { max-width: 860px; }

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.92) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-subtle);
}

.modal-header h3 { font-size: 16px; font-weight: 700; }

.modal-close {
  width: 32px; height: 32px;
  background: var(--bg-overlay);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 18px;
  color: var(--text-secondary);
  transition: all var(--transition-fast);
  line-height: 1;
}
.modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }

.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

/* ─── Form Elements ──────────────────────────────────────────────── */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--bg-overlay);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  transition: all var(--transition-fast);
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--blue-500);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ─── Toast Notifications ────────────────────────────────────────── */
#toast-container {
  position: fixed;
  top: 80px;
  right: 20px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  min-width: 300px;
  max-width: 380px;
  box-shadow: var(--shadow-lg);
  pointer-events: all;
  animation: toastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  border-left: 3px solid;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(60px) scale(0.9); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}

.toast.removing {
  animation: toastOut 0.3s ease forwards;
}

@keyframes toastOut {
  to { opacity: 0; transform: translateX(60px) scale(0.9); }
}

.toast.success { border-left-color: var(--green-400); }
.toast.error   { border-left-color: var(--rose-400); }
.toast.warning { border-left-color: var(--amber-400); }
.toast.info    { border-left-color: var(--blue-400); }

.toast-icon { font-size: 18px; flex-shrink: 0; }
.toast-body { flex: 1; min-width: 0; }
.toast-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.toast-msg { font-size: 12px; color: var(--text-secondary); margin-top: 2px; line-height: 1.4; }

.toast-close {
  font-size: 14px;
  color: var(--text-muted);
  cursor: pointer;
  flex-shrink: 0;
  transition: color var(--transition-fast);
}
.toast-close:hover { color: var(--text-primary); }

/* ─── Picking Cards ──────────────────────────────────────────────── */
.pick-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 16px;
  transition: all var(--transition-med);
}
.pick-card:hover { border-color: var(--border-default); }
.pick-card.completed { opacity: 0.5; border-color: var(--green-500); }

.pick-items { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

.pick-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--bg-overlay);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.pick-item:hover { background: var(--bg-hover); }
.pick-item.scanned { 
  background: rgba(16,185,129,0.08); 
  border-color: rgba(16,185,129,0.3);
  opacity: 0.7;
}

.pick-item .scan-btn {
  margin-left: auto;
  padding: 3px 10px;
  font-size: 11px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-default);
  background: var(--bg-overlay);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.pick-item .scan-btn:hover { background: var(--blue-500); color: #fff; border-color: var(--blue-500); }
.pick-item.scanned .scan-btn { background: var(--green-500); color: #fff; border-color: var(--green-500); }

/* ─── Zone Color Classes ─────────────────────────────────────────── */
.zone-A { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(59,130,246,0.1)); color: var(--blue-400); border-color: rgba(59,130,246,0.2); }
.zone-B { background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(16,185,129,0.1)); color: var(--green-400); border-color: rgba(16,185,129,0.2); }
.zone-C { background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(245,158,11,0.1)); color: var(--amber-400); border-color: rgba(245,158,11,0.2); }
.zone-D { background: linear-gradient(135deg, rgba(244,63,94,0.2), rgba(244,63,94,0.1)); color: var(--rose-400); border-color: rgba(244,63,94,0.2); }
.zone-E { background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(139,92,246,0.1)); color: var(--violet-400); border-color: rgba(139,92,246,0.2); }
.zone-F { background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(6,182,212,0.1)); color: var(--cyan-400); border-color: rgba(6,182,212,0.2); }

/* ─── Stat Row ───────────────────────────────────────────────────── */
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-subtle);
}
.stat-row:last-child { border-bottom: none; }
.stat-row .stat-label { font-size: 12px; color: var(--text-secondary); }
.stat-row .stat-val { font-size: 13px; font-weight: 700; }

/* ─── Tabs ───────────────────────────────────────────────────────── */
.tabs {
  display: flex;
  gap: 4px;
  background: var(--bg-overlay);
  padding: 4px;
  border-radius: var(--radius-md);
  margin-bottom: 20px;
  width: fit-content;
}

.tab {
  padding: 7px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.tab:hover { color: var(--text-primary); }
.tab.active {
  background: var(--bg-elevated);
  color: var(--text-primary);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

/* ─── Lifecycle Progress ─────────────────────────────────────────── */
.lifecycle {
  display: flex;
  align-items: center;
  gap: 0;
  margin: 16px 0;
  overflow-x: auto;
  padding-bottom: 4px;
}

.lc-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  flex: 1;
  min-width: 80px;
}

.lc-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  z-index: 1;
  border: 2px solid;
}

.lc-step.done .lc-dot    { background: var(--green-500); border-color: var(--green-400); }
.lc-step.active .lc-dot  { background: var(--blue-500);  border-color: var(--blue-400); animation: pulse-blue 2s infinite; }
.lc-step.pending .lc-dot { background: var(--bg-overlay); border-color: var(--border-default); }

@keyframes pulse-blue {
  0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.5); }
  50% { box-shadow: 0 0 0 6px rgba(59,130,246,0); }
}

.lc-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-align: center; white-space: nowrap; }
.lc-step.done .lc-label    { color: var(--green-400); }
.lc-step.active .lc-label  { color: var(--blue-400); }

.lc-line {
  flex: 1;
  height: 2px;
  background: var(--border-subtle);
  margin-top: -20px;
  margin-bottom: 24px;
}
.lc-line.done { background: var(--green-500); }

/* ─── Loading Skeleton ───────────────────────────────────────────── */
.skeleton {
  background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--bg-overlay) 50%, var(--bg-elevated) 75%);
  background-size: 200% 100%;
  animation: skeleton-wave 1.5s infinite;
  border-radius: var(--radius-md);
}

@keyframes skeleton-wave {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ─── Number counters ────────────────────────────────────────────── */
.counter { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

/* ─── Pulse indicators ───────────────────────────────────────────── */
.pulse-live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--green-400);
  font-weight: 600;
}

.pulse-live::before {
  content: '';
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green-400);
  animation: pulse-green 1.5s infinite;
  flex-shrink: 0;
}

/* ─── Mini Sparkline ─────────────────────────────────────────────── */
.sparkline { display: block; }

/* ─── Empty State ────────────────────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
  color: var(--text-muted);
}

.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-state h3 { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.empty-state p { font-size: 13px; }

/* ─── Utility Classes ────────────────────────────────────────────── */
.flex { display: flex; }
.flex-center { display: flex; align-items: center; justify-content: center; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.flex-col { display: flex; flex-direction: column; }
.gap-4 { gap: 4px; }
.gap-6 { gap: 6px; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.gap-20 { gap: 20px; }

.mb-4  { margin-bottom: 4px; }
.mb-8  { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.mb-20 { margin-bottom: 20px; }
.mb-24 { margin-bottom: 24px; }

.text-primary   { color: var(--text-primary); }
.text-secondary { color: var(--text-secondary); }
.text-muted     { color: var(--text-muted); }
.text-blue      { color: var(--blue-400); }
.text-green     { color: var(--green-400); }
.text-amber     { color: var(--amber-400); }
.text-rose      { color: var(--rose-400); }
.text-violet    { color: var(--violet-400); }
.text-cyan      { color: var(--cyan-400); }

.font-mono { font-family: 'JetBrains Mono', monospace; }
.font-bold { font-weight: 700; }
.font-600  { font-weight: 600; }

.text-xs { font-size: 11px; }
.text-sm { font-size: 12px; }
.text-md { font-size: 13px; }
.text-lg { font-size: 16px; }
.text-xl { font-size: 20px; }

.rounded { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }

.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ─── Dashboard-specific ─────────────────────────────────────────── */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 20px;
}

@media (max-width: 1400px) {
  .dashboard-grid { grid-template-columns: 1fr; }
}

/* ─── Scrollable list max heights ────────────────────────────────── */
.scroll-list { overflow-y: auto; }
.max-h-300 { max-height: 300px; }
.max-h-400 { max-height: 400px; }
.max-h-500 { max-height: 500px; }

/* ─── Data row for order detail ──────────────────────────────────── */
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.detail-item .detail-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.detail-item .detail-val {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

/* ─── Conflict Banner ────────────────────────────────────────────── */
.conflict-banner {
  background: linear-gradient(135deg, rgba(244,63,94,0.1), rgba(245,158,11,0.08));
  border: 1px solid rgba(244,63,94,0.3);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.conflict-banner .cb-icon { font-size: 24px; flex-shrink: 0; }
.conflict-banner .cb-body { flex: 1; }
.conflict-banner .cb-title { font-size: 14px; font-weight: 700; color: var(--rose-400); margin-bottom: 4px; }
.conflict-banner .cb-desc { font-size: 13px; color: var(--text-secondary); }
.conflict-banner .cb-actions { display: flex; gap: 8px; margin-top: 10px; }

/* ─── Worker Cards ───────────────────────────────────────────────── */
.worker-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  transition: all var(--transition-fast);
}
.worker-card:hover { border-color: var(--border-default); background: var(--bg-overlay); }

.worker-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  font-weight: 700;
  color: #fff;
}

.worker-info { flex: 1; min-width: 0; }
.worker-name { font-size: 13px; font-weight: 600; }
.worker-role { font-size: 11px; color: var(--text-secondary); }
.worker-stat { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* ─── Print Styles ───────────────────────────────────────────────── */
@media print {
  #sidebar, #topbar, .no-print { display: none !important; }
  #main { margin-left: 0 !important; }
  body { background: #fff !important; color: #000 !important; }
}

/* ─── Animations library ─────────────────────────────────────────── */
.animate-in {
  animation: fadeIn 0.4s ease forwards;
}

.animate-scale {
  animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}

.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(30px) scale(0.97); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}

/* ─── Floating Action Button ─────────────────────────────────────── */
.fab {
  position: fixed;
  bottom: 28px;
  right: 28px;
  width: 52px; height: 52px;
  background: linear-gradient(135deg, var(--blue-500), var(--violet-500));
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(59,130,246,0.5);
  transition: all var(--transition-med);
  z-index: 500;
  border: none;
  color: #fff;
}
.fab:hover { transform: scale(1.1) rotate(15deg); box-shadow: 0 6px 30px rgba(59,130,246,0.6); }

/* ─── Divider ────────────────────────────────────────────────────── */
.divider { border: none; border-top: 1px solid var(--border-subtle); margin: 16px 0; }

/* ─── Tag ────────────────────────────────────────────────────────── */
.tag {
  display: inline-block;
  padding: 2px 8px;
  background: var(--bg-overlay);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  font-size: 11px;
  color: var(--text-secondary);
}

  // ─── Pre-seeded Orders ───────────────────────────────────────────
  function generateOrders() {
    const statuses = ['created', 'allocated', 'picking', 'packing', 'qc', 'dispatched'];
    const types = ['VIP', 'Express', 'Standard', 'Bulk'];
    const typeWeights = [0.1, 0.2, 0.5, 0.2]; // probability distribution

    const orders = [];
    const now = new Date();

    let idCounter = 1000;

    for (let i = 0; i < 120; i++) {
      const typeRand = Math.random();
      let cumulative = 0;
      let type = 'Standard';
      for (let t = 0; t < types.length; t++) {
        cumulative += typeWeights[t];
        if (typeRand < cumulative) { type = types[t]; break; }
      }

      const customer = CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)];
      const createdHoursAgo = Math.random() * 48;
      const createdAt = new Date(now - createdHoursAgo * 3600000);

      // SLA based on type
      const slaDurationH = { VIP: 4, Express: 8, Standard: 24, Bulk: 72 }[type];
      const slaDeadline = new Date(createdAt.getTime() + slaDurationH * 3600000);
      const hoursToSla = (slaDeadline - now) / 3600000;

      // Status — recent orders more likely to be early stage
      let status;
      if (createdHoursAgo < 2) status = 'created';
      else if (createdHoursAgo < 6) status = statuses[Math.floor(Math.random() * 3)];
      else if (createdHoursAgo < 24) status = statuses[Math.floor(Math.random() * 5)];
      else status = Math.random() < 0.7 ? 'dispatched' : statuses[Math.floor(Math.random() * 5) + 1];

      // Items
      const numItems = Math.floor(Math.random() * 4) + 1;
      const items = [];
      const usedSkus = new Set();
      for (let j = 0; j < numItems; j++) {
        let prod;
        do { prod = PRODUCTS[Math.floor(Math.random() * PRODUCTS.length)]; }
        while (usedSkus.has(prod.id));
        usedSkus.add(prod.id);
        const qty = Math.floor(Math.random() * 10) + 1;
        items.push({ skuId: prod.id, skuName: prod.name, qty, unitPrice: prod.unitPrice, zone: prod.zone, bin: prod.bin });
      }

      const totalValue = items.reduce((s, item) => s + item.qty * item.unitPrice, 0);
      const carrier = CARRIERS[Math.floor(Math.random() * CARRIERS.length)];
      const priorityScore = calculatePriorityScore({ type, hoursToSla, totalValue, customerTier: customer.tier });

      orders.push({
        id: `ORD-${++idCounter}`,
        type,
        customer,
        createdAt: createdAt.toISOString(),
        slaDeadline: slaDeadline.toISOString(),
        hoursToSla,
        status,
        items,
        totalValue,
        carrier,
        priorityScore,
        trackingId: status === 'dispatched' ? `TRK${Math.random().toString(36).substr(2, 9).toUpperCase()}` : null,
        pickerAssigned: ['picking', 'packing', 'qc', 'dispatched'].includes(status) ? WORKERS[Math.floor(Math.random() * 4)].id : null,
        notes: '',
        exceptionId: null,
        isConflict: false,
        dispatchedAt: status === 'dispatched' ? new Date(now - Math.random() * 12 * 3600000).toISOString() : null,
      });
    }

    // Force a few conflict situations
    orders.push({
      id: 'ORD-2099',
      type: 'VIP',
      customer: CUSTOMERS[0],
      createdAt: new Date(now - 1.5 * 3600000).toISOString(),
      slaDeadline: new Date(now.getTime() + 2.5 * 3600000).toISOString(),
      hoursToSla: 2.5,
      status: 'created',
      items: [{ skuId: 'SKU-A002', skuName: 'Smart Watch Series 7', qty: 10, unitPrice: 8999, zone: 'A', bin: 'A-01-05' }],
      totalValue: 89990,
      carrier: CARRIERS[0],
      priorityScore: 98,
      trackingId: null,
      pickerAssigned: null,
      notes: 'URGENT: Customer pickup in 3 hours',
      exceptionId: null,
      isConflict: true,
      dispatchedAt: null,
    });

    return orders.sort((a, b) => b.priorityScore - a.priorityScore);
  }

  function calculatePriorityScore({ type, hoursToSla, totalValue, customerTier }) {
    let score = 0;
    // Order type weight
    score += { VIP: 40, Express: 25, Standard: 10, Bulk: 5 }[type];
    // SLA urgency (max 30 pts)
    if (hoursToSla < 0) score += 30;
    else if (hoursToSla < 2) score += 28;
    else if (hoursToSla < 4) score += 22;
    else if (hoursToSla < 8) score += 15;
    else if (hoursToSla < 24) score += 8;
    else score += 2;
    // Value weight (max 15 pts)
    score += Math.min(15, Math.floor(totalValue / 10000));
    // Customer tier (max 15 pts)
    score += { VIP: 15, Premium: 10, Standard: 5, Basic: 2 }[customerTier] || 5;
    return Math.min(100, score);
  }

      const hour = new Date(now - h * 3600000);
      const hourNum = hour.getHours();
      // Business hours have more activity
      const base = (hourNum >= 8 && hourNum <= 20) ? 18 : 4;
      const jitter = Math.floor(Math.random() * 10) - 5;
      data.push({
        hour: hour,
        orders: Math.max(0, base + jitter),
        picks: Math.max(0, (base + jitter) * 3 + Math.floor(Math.random() * 8)),
        dispatched: Math.max(0, base + Math.floor(Math.random() * 5)),
      });
    }
    return data;
  }

  // ─── Zone metrics ────────────────────────────────────────────────
  function generateZoneMetrics(products) {
    const metrics = {};
    ZONES.forEach(z => {
      const zoneProds = products.filter(p => p.zone === z);
      const totalStock = zoneProds.reduce((s, p) => s + p.currentStock, 0);
      const totalCapacity = zoneProds.reduce((s, p) => s + p.maxCapacity, 0);
      const outOfStock = zoneProds.filter(p => p.currentStock === 0).length;
      const lowStock = zoneProds.filter(p => p.stockStatus === 'low' || p.stockStatus === 'critical').length;
      const utilization = totalCapacity > 0 ? (totalStock / totalCapacity) * 100 : 0;
      metrics[z] = {
        zone: z,
        name: ZONE_NAMES[z],
        productCount: zoneProds.length,
        totalStock,
        totalCapacity,
        utilization: Math.round(utilization),
        outOfStock,
        lowStock,
        pendingPicks: Math.floor(Math.random() * 12),
      };
    });
    return metrics;

   STATE.JS — Centralized App State Manager
